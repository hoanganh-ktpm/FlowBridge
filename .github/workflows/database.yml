name: PostgreSQL database checks

on:
  push:
  pull_request:

jobs:
  migrations-and-seed:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DXOS_TEST_ADMIN_URL: postgresql+psycopg://postgres:local-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.1
      - run: uv sync --frozen --group dev --group database
      - run: uv run --frozen --group database pytest tests/e2e/database -m "integration and e2e" -q
