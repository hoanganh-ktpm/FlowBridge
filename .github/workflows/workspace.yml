name: Decision Workspace
on: [push, pull_request]
jobs:
  workspace:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ['16', '17']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
      - run: uv sync --locked --group dev --group database
      - run: uv run --locked python -m pytest tests/domain/data_workspace tests/platform/test_decision_test_environment.py -q
      - run: uv run --locked python -m scripts.decision_test_environment --image postgres:${{ matrix.postgres }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-test-evidence-pg${{ matrix.postgres }}
          path: .tmp/decision-tests/*/results.xml
