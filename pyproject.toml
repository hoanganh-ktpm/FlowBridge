[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "flowbridge"
version = "0.2.0.dev0"
description = "Modular Open-Core adapters for FlowBridge DX-OS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "fastapi==0.143.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "sqlalchemy[asyncio]==2.1.4",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
build = ["hatchling==1.32.4"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.0"]

[tool.uv]
required-version = "==0.13.1"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.hatch.build.targets.sdist]
only-include = [
    "backend", "services", "portal/src", "portal/server",
    "portal/public/favicon.png", "portal/public/logo-flowbridge.png",
    "portal/tests", "portal/package.json", "portal/package-lock.json",
    "portal/components.json", "portal/tsconfig.json", "portal/vite.config.ts",
    "portal/vitest.config.ts", "portal/playwright.config.ts", "portal/index.html",
    "portal/flowbridge-tokens.css", "portal/server.mjs", "portal/start.ps1",
    "portal/README.md", "portal/THIRD-PARTY-NOTICES.md",
    "portal/.env.example", "portal/.gitignore", "contracts", "workflows", "infra",
    "tests", "docs", "README.md", "AGENTS.md",
    "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE", "pyproject.toml",
    "uv.lock", "uv.lock.license", ".python-version", ".python-version.license",
    ".env.example", ".gitignore", ".gitattributes", ".dockerignore",
]
exclude = ["/_archive", "/docs/reference", "/docs/CHECKPOINT.md", "**/__pycache__", "**/*.pyc", "**/node_modules"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]
extend-exclude = ["_archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
norecursedirs = ["_archive", ".venv", ".tools", ".cache", "node_modules"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers -m 'not integration and not e2e'"
markers = [
    "integration: requires the explicitly configured upstream engine",
    "e2e: exercises multiple real module/service boundaries",
]
