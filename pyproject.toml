[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "flowbridge"
version = "0.1.0"
description = "Headless OpenCore service adapters for FlowBridge"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "fastapi==0.143.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "sqlalchemy[asyncio]==2.1.4",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
ml = [
    "tabicl==2.2.0",
    "pandas==2.3.3",
]
rag = [
    "chromadb==1.5.9",
    "sentence-transformers==6.1.0",
    "rank-bm25==0.2.2",
]

[dependency-groups]
build = ["hatchling==1.32.4"]
dev = [
    "numpy==2.5.4",
    "rank-bm25==0.2.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
]

[tool.uv]
required-version = "==0.13.1"

[tool.hatch.build.targets.wheel]
packages = ["backend/flowbridge"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/agent-hub-api.yaml" = "flowbridge/agent_hub/contracts/agent-hub-api.yaml"
"contracts/agent-hub" = "flowbridge/agent_hub/contracts/agent-hub"

[tool.hatch.build.targets.sdist]
include = [
    "/backend/flowbridge",
    "/tests",
    "/contracts",
    "/infra/gateway",
    "/docs/GATEWAY.md",
    "/examples/rag",
    "/examples/ml",
    "/langflow/components/supplier_ml",
    "/langflow/components/supplier_rag",
    "/langflow/rag",
    "/langflow/components/flowbridge",
    "/langflow/runtime",
    "/langflow/flows",
    "/langflow/tests",
    "/langflow/setup_agent.py",
    "/langflow/setup_ver2.py",
    "/langflow/setup_ver3.py",
    "/langflow/verify_ver3.py",
    "/langflow/add_frontend_response.py",
    "/langflow/install_ver2_exports.py",
    "/langflow/FRONTEND-JSON.md",
    "/langflow/DELIVERY-ORDERS.md",
    "/langflow/schemas",
    "/langflow/examples/frontend_response",
    "/langflow/repair_ver3_routes.py",
    "/langflow/VER3.md",
    "/langflow/upgrade_ver2_data.py",
    "/langflow/upgrade_ver2_coordination.py",
    "/langflow/add_ver2_protocol_nodes.py",
    "/langflow/repair_ver2_model.py",
    "/langflow/repair_ver2_structured.py",
    "/langflow/VER2.md",
    "/langflow/evaluate.py",
    "/langflow/scenarios.json",
    "/langflow/scenarios.json.license",
    "/langflow/agent.env.example",
    "/langflow/README.md",
    "/langflow/requirements.txt",
    "/langflow/requirements.lock.txt",
    "/langflow/start.cmd",
    "/langflow/start.ps1",
    "/langflow/start-sso.ps1",
    "/langflow/start-sso.cmd",
    "/docs/LANGFLOW-SSO.md",
    "/docs/AGENT-HUB.md",
    "/docs/MOBILE-PLAN.md",
    "/docs/ML-SERVICE.md",
    "/docs/RAG.md",
    "/infra/identity",
    "/infra/dev",
    "/infra/chat",
    "/chat-docker.cmd",
    "/HUONG-DAN-CHAY.md",
    "/HUONG-DAN-SU-DUNG-BACKEND.md",
    "/docs/DOCKER-CHAT.md",
    "/Dockerfile",
    "/compose.yaml",
    "/compose.env",
    "/.dockerignore",
    "/docs/DEV-CONTAINERS.md",
    "/clients/sso",
    "/scripts",
    "/alembic",
    "/alembic.ini",
    "/pyproject.toml",
    "/uv.lock",
    "/uv.lock.license",
    "/.python-version",
    "/.python-version.license",
    "/.env.example",
    "/.gitignore",
    "/.gitattributes",
    "/README.md",
    "/docs/SUPABASE-API.md",
    "/docs/SSO.md",
    "/docs/IDENTITY-CORE.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.ruff]
extend-exclude = ["scripts/supplier_demo_source.py"]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers -m 'not integration'"
markers = [
    "integration: requires the real upstream services named by the test profile",
    "e2e: exercises the application across OpenCore service boundaries",
]
