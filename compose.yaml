# Local development only. scripts/dev_stack.py supplies the image manifest/env file.
x-python-build: &python-build
  context: .
  dockerfile: Dockerfile
  args:
    PYTHON_IMAGE: ${FLOWBRIDGE_PYTHON_IMAGE:?Use infra/dev/images.env}
    UV_IMAGE: ${FLOWBRIDGE_UV_IMAGE:?Use infra/dev/images.env}
x-local-env: &local-env
  FLOWBRIDGE_DEV_IAM_PORT: ${FLOWBRIDGE_DEV_IAM_PORT:-19444}
  FLOWBRIDGE_DEV_API_PORT: ${FLOWBRIDGE_DEV_API_PORT:-18082}
  FLOWBRIDGE_DEV_TEST_MODE: ${FLOWBRIDGE_DEV_TEST_MODE:-false}
x-tooling: &tooling
  build:
    <<: *python-build
    target: tooling
  profiles: [tools]
  environment: *local-env
  volumes:
    - identity-state:/state
    - backend-config:/config:ro
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  prepare:
    build:
      <<: *python-build
      target: runtime
    profiles: [tools]
    user: "0:0"
    environment: *local-env
    command: [python, scripts/container_dev.py, prepare]
    secrets: [database-source]
    volumes:
      - identity-state:/state
      - backend-config:/config
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  identity:
    image: ${FLOWBRIDGE_KEYCLOAK_IMAGE:?Use infra/dev/images.env}
    entrypoint: [/bin/bash, /run/start-identity.sh]
    environment:
      <<: *local-env
      KC_BOOTSTRAP_ADMIN_USERNAME: flowbridge-local-admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_HTTP_MANAGEMENT_PORT: "9000"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    volumes:
      - identity-state:/state:ro
      - type: volume
        source: identity-state
        target: /opt/keycloak/data/import
        volume:
          subpath: import
      - identity-data:/opt/keycloak/data
      - ./infra/dev/start-identity.sh:/run/start-identity.sh:ro
    ports:
      - "127.0.0.1:${FLOWBRIDGE_DEV_IAM_PORT:-19444}:${FLOWBRIDGE_DEV_IAM_PORT:-19444}"
      - "127.0.0.1:${FLOWBRIDGE_DEV_API_PORT:-18082}:${FLOWBRIDGE_DEV_API_PORT:-18082}"
      - "127.0.0.1:8761:8761"
      - "127.0.0.1:8762:8762"
    healthcheck:
      test: [CMD, /bin/bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 60s
    security_opt: [no-new-privileges:true]

  api:
    build:
      <<: *python-build
      target: runtime
    network_mode: service:identity
    depends_on:
      identity:
        condition: service_healthy
    environment: *local-env
    volumes:
      - identity-state:/state:ro
      - backend-config:/config:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, scripts/container_dev.py, api-health]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  check-db:
    <<: *tooling
    command: [python, scripts/container_dev.py, db-check]

  tools:
    <<: *tooling
    network_mode: service:identity
    command: [python, scripts/container_dev.py, fixture]

  unit:
    build:
      <<: *python-build
      target: unit
    profiles: [test]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  browser:
    build: &browser-build
      context: .
      dockerfile: infra/dev/Browser.Dockerfile
      args:
        PLAYWRIGHT_IMAGE: ${FLOWBRIDGE_PLAYWRIGHT_IMAGE:?Use infra/dev/images.env}
    profiles: [test]
    network_mode: service:identity
    init: true
    shm_size: 1gb
    volumes: [identity-state:/state]
    tmpfs: [/workspace/.cache, /tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  client-a:
    build: *browser-build
    profiles: [clients]
    network_mode: service:identity
    command: [node, server.mjs, --client, a, --port, "8761", --host, 0.0.0.0]
    volumes: [identity-state:/state:ro]
    depends_on:
      api:
        condition: service_healthy

  client-b:
    build: *browser-build
    profiles: [clients]
    network_mode: service:identity
    command: [node, server.mjs, --client, b, --port, "8762", --host, 0.0.0.0]
    volumes: [identity-state:/state:ro]
    depends_on:
      api:
        condition: service_healthy

volumes:
  identity-state:
  identity-data:
  backend-config:

secrets:
  database-source:
    file: ${FLOWBRIDGE_DEV_ENV_FILE:-.env.example}
