<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>FlowBridge — Mua hàng</title>
    <link rel="stylesheet" href="/business.css">
  </head>
  <body>
    <main>
      <h1>FlowBridge</h1>
      <p>Quản lý yêu cầu mua hàng, đề xuất và xác nhận đơn.</p>

      <p id="status" role="status">Đang khởi tạo…</p>

      <details><summary>Thông tin phiên và hồ sơ</summary><pre id="result"></pre></details>
      <hr>
      <div id="business-root"></div>
    </main>
    <script type="module" src="/app.js"></script>
