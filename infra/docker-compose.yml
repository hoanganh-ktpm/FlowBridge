name: flowbridge-integration

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: https://localhost:18443
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /run/tls/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /run/tls/server.key
      KC_BOOTSTRAP_ADMIN_USERNAME: flowbridge-test-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${FLOWBRIDGE_KEYCLOAK_ADMIN_PASSWORD:?Missing local secret}
    ports:
      - 127.0.0.1:18443:8443
    volumes:
      - keycloak_data:/opt/keycloak/data
      - type: bind
        source: ${FLOWBRIDGE_DOCKER_RUNTIME_DIR:?Missing local runtime directory}/realm
        target: /opt/keycloak/data/import
        read_only: true
      - type: bind
        source: ${FLOWBRIDGE_DOCKER_RUNTIME_DIR}/tls
        target: /run/tls
        read_only: true
    mem_limit: 1g
    restart: unless-stopped

  hasura:
    image: hasura/graphql-engine:v2.48.16@sha256:6ff7d8ba122c69f7be377092b0c1f5314d3e4e28274dc089cd774ce6a8ba6479
    env_file:
      - ${FLOWBRIDGE_DOCKER_RUNTIME_DIR:?Missing local runtime directory}/hasura.env
    environment:
      HASURA_GRAPHQL_METADATA_DATABASE_EXTENSIONS_SCHEMA: extensions
      HASURA_GRAPHQL_ADMIN_SECRET: ${FLOWBRIDGE_HASURA_ADMIN_SECRET:?Missing local secret}
      HASURA_GRAPHQL_JWT_SECRET: ${FLOWBRIDGE_HASURA_JWT_CONFIG:?Missing JWT configuration}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      HASURA_GRAPHQL_DISABLE_CORS: "true"
      HASURA_GRAPHQL_ADMIN_INTERNAL_ERRORS: "false"
    ports:
      - 127.0.0.1:18080:8080
    mem_limit: 1g
    restart: unless-stopped

volumes:
  keycloak_data:
