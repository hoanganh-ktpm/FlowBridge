# FlowBridge; see LICENSE. Overlay on the canonical root compose.yaml; not a second IAM stack.
services:
  client-a:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: runtime
      args:
        PLAYWRIGHT_IMAGE: ${FLOWBRIDGE_PLAYWRIGHT_IMAGE:?Use infra/dev/images.env}
        KEYCLOAK_IMAGE: ${FLOWBRIDGE_KEYCLOAK_IMAGE:?Use infra/dev/images.env}
    command: [node, server.mjs, --port, "8761", --host, 0.0.0.0]

  prepare:
    command: [python, scripts/container_chat.py, prepare]
    environment:
      FLOWBRIDGE_CHAT_PORT: ${FLOWBRIDGE_CHAT_PORT:-7861}
    secrets: [langflow-seed, langflow-key-source, agent-source]
    volumes:
      - chat-config:/chat-config
      - langflow-config:/langflow-config
      - langflow-state:/var/lib/langflow

  identity:
    image: ${COMPOSE_PROJECT_NAME:-flowbridge-chat}-identity
    build:
      context: .
      dockerfile: web/Dockerfile
      target: identity
      args:
        PLAYWRIGHT_IMAGE: ${FLOWBRIDGE_PLAYWRIGHT_IMAGE:?Use infra/dev/images.env}
        KEYCLOAK_IMAGE: ${FLOWBRIDGE_KEYCLOAK_IMAGE:?Use infra/dev/images.env}
    ports:
      - "127.0.0.1:${FLOWBRIDGE_CHAT_PORT:-7861}:${FLOWBRIDGE_CHAT_PORT:-7861}"

  api:
    build:
      target: chat-runtime
      args:
        CHAT_WITH_ML: ${FLOWBRIDGE_CHAT_ML:-false}
        CHAT_WITH_RAG: ${FLOWBRIDGE_CHAT_RAG:-false}
    command: [python, scripts/container_chat.py, serve]
    environment:
      FLOWBRIDGE_CHAT_ML: ${FLOWBRIDGE_CHAT_ML:-false}
      FLOWBRIDGE_CHAT_RAG: ${FLOWBRIDGE_CHAT_RAG:-false}
      OMP_NUM_THREADS: ${FLOWBRIDGE_ML_CPU_THREADS:-4}
      MKL_NUM_THREADS: ${FLOWBRIDGE_ML_CPU_THREADS:-4}
      OPENBLAS_NUM_THREADS: ${FLOWBRIDGE_ML_CPU_THREADS:-4}
      FLOWBRIDGE_AGENT_HUB_ENABLED: ${FLOWBRIDGE_AGENT_HUB_ENABLED:-false}
      FLOWBRIDGE_AGENT_HUB_WORKER_ENABLED: ${FLOWBRIDGE_AGENT_HUB_WORKER_ENABLED:-true}
      FLOWBRIDGE_AGENT_HUB_QUEUE_TIMEOUT_SECONDS: ${FLOWBRIDGE_AGENT_HUB_QUEUE_TIMEOUT_SECONDS:-300}
    volumes:
      - chat-config:/chat-config:ro
      - ${FLOWBRIDGE_CHAT_MODELS_DIR:-./.cache/models}:/models:ro
      - ${FLOWBRIDGE_CHAT_ML_DIR:-./.cache/ml}:/ml-context:ro
    depends_on:
      langflow:
        condition: service_healthy

  langflow:
    build:
      context: .
      dockerfile: infra/chat/Langflow.Dockerfile
      args:
        LANGFLOW_IMAGE: ${FLOWBRIDGE_LANGFLOW_IMAGE:?Use infra/chat/images.env}
    network_mode: service:identity
    depends_on:
      identity:
        condition: service_healthy
    environment:
      FLOWBRIDGE_CHAT_PORT: ${FLOWBRIDGE_CHAT_PORT:-7861}
    volumes:
      - langflow-state:/var/lib/langflow
      - langflow-config:/langflow-config:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, /opt/flowbridge/scripts/container_chat.py, langflow-health]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  check-db:
    command: [python, scripts/container_chat.py, db-check]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: tooling
      args:
        PYTHON_IMAGE: ${FLOWBRIDGE_PYTHON_IMAGE:?Use infra/dev/images.env}
        UV_IMAGE: ${FLOWBRIDGE_UV_IMAGE:?Use infra/dev/images.env}
    profiles: [tools]
    command: [python, scripts/container_chat.py, migrate]
    volumes: [backend-config:/config:ro]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  chat-config:
  langflow-config:
  langflow-state:

secrets:
  langflow-seed:
    file: ${FLOWBRIDGE_CHAT_SEED_DB:-./.cache/chat-stack/flowbridge-chat/seed/langflow.db}
  langflow-key-source:
    file: ${FLOWBRIDGE_CHAT_SEED_KEY:-./.cache/chat-stack/flowbridge-chat/seed/secret_key}
  agent-source:
    file: ${FLOWBRIDGE_CHAT_AGENT_ENV:-./langflow/data/agent.env}
