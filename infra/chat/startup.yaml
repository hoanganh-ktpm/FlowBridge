# Default local startup graph; legacy dev/chat helpers select their own base/overlay explicitly.
x-startup-job: &startup-job
  build:
    context: .
    dockerfile: Dockerfile
    target: tooling
    args:
      PYTHON_IMAGE: ${FLOWBRIDGE_PYTHON_IMAGE:?Use infra/dev/images.env}
      UV_IMAGE: ${FLOWBRIDGE_UV_IMAGE:?Use infra/dev/images.env}
  pull_policy: build
  network_mode: service:identity
  volumes: [identity-state:/state:ro, backend-config:/config:ro]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  prepare:
    profiles: !reset []
    pull_policy: build
    command: [python, scripts/compose_startup.py, prepare]
    secrets: !override [database-source, agent-source]
    volumes:
      - type: bind
        source: ${FLOWBRIDGE_CHAT_SOURCE_DIR:-./langflow/data}
        target: /seed-source
        read_only: true
        bind:
          create_host_path: false

  identity:
    depends_on:
      prepare:
        condition: service_completed_successfully

  database-init:
    <<: *startup-job
    command: [python, scripts/compose_startup.py, database]
    environment:
      FLOWBRIDGE_COMPOSE_MIGRATE: ${FLOWBRIDGE_COMPOSE_MIGRATE:-true}
    depends_on:
      identity:
        condition: service_healthy

  team-accounts:
    <<: *startup-job
    command: [python, scripts/compose_startup.py, accounts]
    environment:
      FLOWBRIDGE_TEAM_ACCOUNTS_ENABLED: ${FLOWBRIDGE_TEAM_ACCOUNTS_ENABLED:-true}
      FLOWBRIDGE_TEAM_TEST_PASSWORD: ${FLOWBRIDGE_TEAM_TEST_PASSWORD:-FlowBridgeTest@2026}
      FLOWBRIDGE_TEAM_GRANTED_BY: ${FLOWBRIDGE_TEAM_GRANTED_BY:-}
    depends_on:
      database-init:
        condition: service_completed_successfully
      identity:
        condition: service_healthy

  langflow:
    pull_policy: build
    environment:
      FLOWBRIDGE_COMPOSE_UPGRADE_FLOWS: ${FLOWBRIDGE_COMPOSE_UPGRADE_FLOWS:-true}

  upgrade-flows:
    build:
      context: .
      dockerfile: infra/chat/Langflow.Dockerfile
      args:
        LANGFLOW_IMAGE: ${FLOWBRIDGE_LANGFLOW_IMAGE:?Use infra/chat/images.env}
    pull_policy: build
    network_mode: service:identity
    environment:
      FLOWBRIDGE_CHAT_PORT: ${FLOWBRIDGE_CHAT_PORT:-7861}
      FLOWBRIDGE_COMPOSE_UPGRADE_FLOWS: ${FLOWBRIDGE_COMPOSE_UPGRADE_FLOWS:-true}
    volumes: [langflow-state:/var/lib/langflow, langflow-config:/langflow-config:ro]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [python, /opt/flowbridge/scripts/container_chat.py, upgrade-flows]
    healthcheck:
      disable: true
    depends_on:
      langflow:
        condition: service_healthy

  api:
    pull_policy: build
    depends_on:
      database-init:
        condition: service_completed_successfully
      team-accounts:
        condition: service_completed_successfully
      upgrade-flows:
        condition: service_completed_successfully

  client-a:
    profiles: !reset []
    pull_policy: build
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8761/config.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  client-b:
    profiles: !reset []
    pull_policy: build
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8762/config.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

secrets:
  database-source:
    file: ${FLOWBRIDGE_DEV_ENV_FILE:-.env}
