# Run with --project-directory at the repository root and BOTH image env manifests.
services:
  prepare:
    extends: {file: compose.yaml, service: prepare}
    command: [python, scripts/prepare_gateway.py]
    environment:
      FLOWBRIDGE_GATEWAY_PROXY_IP: ${FLOWBRIDGE_GATEWAY_PROXY_IP:-172.29.240.2}
      FLOWBRIDGE_GATEWAY_BACKEND_SUBNET: ${FLOWBRIDGE_GATEWAY_BACKEND_SUBNET:-172.29.240.0/24}
      FLOWBRIDGE_GATEWAY_BACKEND_RANGE: ${FLOWBRIDGE_GATEWAY_BACKEND_RANGE:-172.29.240.128/25}
    volumes:
      - gateway-config:/gateway-config
  identity:
    extends: {file: compose.yaml, service: identity}
    environment:
      FLOWBRIDGE_DEV_IAM_HOST: identity
    # The backend is reachable only from the backend network, never a host port.
    ports: !override
      - "127.0.0.1:${FLOWBRIDGE_DEV_IAM_PORT:-19454}:${FLOWBRIDGE_DEV_IAM_PORT:-19454}"
    networks: [backend]
  api:
    extends: {file: compose.yaml, service: api}
  check-db:
    extends: {file: compose.yaml, service: check-db}
    networks: [backend]
  tools:
    extends: {file: compose.yaml, service: tools}
    environment:
      FLOWBRIDGE_GATEWAY_TEST: "true"
  browser:
    extends: {file: compose.yaml, service: browser}
    command: [npx, playwright, test, tests/gateway.spec.mjs]
    environment:
      FLOWBRIDGE_GATEWAY_TEST: "true"
  gateway: &gateway
    image: ${FLOWBRIDGE_APISIX_IMAGE:?Use infra/gateway/images.env}
    user: "636:0"
    depends_on:
      api: {condition: service_healthy}
    volumes:
      - ./infra/gateway/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - type: volume
        source: gateway-config
        target: /usr/local/apisix/conf/apisix.yaml
        read_only: true
        volume: {subpath: apisix.yaml}
      - gateway-config:/gateway-config:ro
    ports:
      - "127.0.0.1:${FLOWBRIDGE_GATEWAY_PORT:-19453}:9443"
    networks:
      edge:
      backend:
        ipv4_address: ${FLOWBRIDGE_GATEWAY_PROXY_IP:-172.29.240.2}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  gateway-timeout:
    <<: *gateway
    profiles: [test]
    ports: []
    networks: [edge, backend]
    depends_on:
      slow-upstream: {condition: service_started}
    volumes:
      - ./infra/gateway/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - type: volume
        source: gateway-config
        target: /usr/local/apisix/conf/apisix.yaml
        read_only: true
        volume: {subpath: timeout-apisix.yaml}
      - gateway-config:/gateway-config:ro
  slow-upstream:
    extends: {file: compose.yaml, service: check-db}
    command: [python, tests/integration/gateway/slow_upstream.py]
    volumes: !override []
    profiles: [test]
    networks: [backend]
  external:
    extends: {file: compose.yaml, service: check-db}
    command: [python, -m, pytest, tests/integration/gateway, -m, integration, -q, --tb=short, -p, "no:cacheprovider", --basetemp, /tmp/pytest]
    # Only CA is mounted; no IdP secrets, DB credentials or backend network.
    volumes: !override
      - type: volume
        source: gateway-config
        target: /gateway-ca.pem
        read_only: true
        volume: {subpath: ca.pem}
    environment:
      FLOWBRIDGE_GATEWAY_TEST: "true"
      FLOWBRIDGE_GATEWAY_CA: /gateway-ca.pem
    networks: [edge]
networks:
  edge:
  backend:
    ipam:
      config:
        - subnet: ${FLOWBRIDGE_GATEWAY_BACKEND_SUBNET:-172.29.240.0/24}
          ip_range: ${FLOWBRIDGE_GATEWAY_BACKEND_RANGE:-172.29.240.128/25}
volumes:
  identity-state:
  identity-data:
  backend-config:
  gateway-config:
secrets:
  database-source:
    file: ${FLOWBRIDGE_DEV_ENV_FILE:-.env.example}
