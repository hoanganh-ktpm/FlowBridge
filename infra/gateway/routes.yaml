# Explicit implemented operations only; no wildcard or application/admin routes.
routes:
  - id: identity-config
    uri: /api/v1/core/identity/config
    methods: [GET, OPTIONS]
    upstream_id: identity-api
    plugins:
      limit-req: &identity-rate-limit
        rate: 10
        burst: 20
        key_type: var
        key: remote_addr
        rejected_code: 429
        nodelay: true
  - id: identity-me
    uri: /api/v1/core/identity/me
    methods: [GET, OPTIONS]
    upstream_id: identity-api
    plugins:
      limit-req: *identity-rate-limit
      openid-connect:
        introspection_endpoint_auth_method: client_secret_basic
        bearer_only: true
        ssl_verify: true
        timeout: 3
        introspection_interval: 1
        set_access_token_header: false
        set_id_token_header: false
        set_userinfo_header: false
        set_refresh_token_header: false
upstreams:
  - id: identity-api
    type: roundrobin
    # The renderer replaces only the port with this deployment's API port.
    nodes: {"identity:18092": 1}
    timeout: {connect: 3, send: 3, read: 3}
    retries: 0
    checks:
      active:
        type: http
        http_path: /_ops/live
        healthy: {interval: 5, successes: 1}
        unhealthy: {interval: 5, http_failures: 2, tcp_failures: 2}
