components:
  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Date:
      type: string
      format: date
    Decimal4:
      type: string
      pattern: ^(0|[1-9][0-9]{0,13})\.[0-9]{4}$
      examples:
      - '10000.0000'
      description: NUMERIC(18,4); chuỗi thập phân để tránh mất độ chính xác.
    PositiveDecimal4:
      type: string
      pattern: ^(?!0\.0000$)(0|[1-9][0-9]{0,13})\.[0-9]{4}$
      examples:
      - '10.5000'
    Version:
      type: integer
      minimum: 1
    Supplier:
      type: object
      additionalProperties: false
      properties:
        supplier_id:
          $ref: '#/components/schemas/Uuid'
          description: Khóa nội bộ
          x-sql-type: UUID
        supplier_code:
          type: string
          maxLength: 50
          description: Mã hiển thị/API
          x-sql-type: VARCHAR(50)
        supplier_name:
          type: string
          maxLength: 255
          description: Tên nhà cung cấp
          x-sql-type: VARCHAR(255)
        email:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          description: Email liên hệ
          x-sql-type: VARCHAR(255)
        phone:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          description: Điện thoại
          x-sql-type: VARCHAR(50)
        address:
          anyOf:
          - type: string
          - type: 'null'
          description: Địa chỉ
          x-sql-type: TEXT
        city:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          description: Vị trí supplier
          x-sql-type: VARCHAR(120)
        postal_code:
          anyOf:
          - type: string
            maxLength: 30
          - type: 'null'
          description: Mã bưu chính
          x-sql-type: VARCHAR(30)
        country_of_origin:
          anyOf:
          - type: string
            pattern: ^[A-Z]{2}$
          - type: 'null'
          description: Mã quốc gia ISO alpha-2
          x-sql-type: CHAR(2)
        status:
          type: string
          enum:
          - active
          - inactive
          - blocked
          description: active / inactive / blocked
          x-sql-type: VARCHAR(20)
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: Thời điểm tạo
          x-sql-type: TIMESTAMPTZ
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: Thời điểm cập nhật
          x-sql-type: TIMESTAMPTZ
      required:
      - supplier_id
      - supplier_code
      - supplier_name
      - email
      - phone
      - address
      - city
      - postal_code
      - country_of_origin
      - status
      - created_at
      - updated_at
      x-database-table: suppliers
      description: C01 | suppliers [P0] - Thông tin nhà cung cấp và định danh tham chiếu
    Product:
      type: object
      additionalProperties: false
      properties:
        product_id:
          $ref: '#/components/schemas/Uuid'
          description: ID sản phẩm
          x-sql-type: UUID
        product_code:
          type: string
          maxLength: 80
          description: Part number nội bộ
          x-sql-type: VARCHAR(80)
        product_name:
          type: string
          maxLength: 255
          description: Tên sản phẩm
          x-sql-type: VARCHAR(255)
        product_category:
          type: string
          maxLength: 120
          description: Feature categorical
          x-sql-type: VARCHAR(120)
        unit:
          type: string
          maxLength: 30
          description: Đơn vị tính
          x-sql-type: VARCHAR(30)
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Mô tả
          x-sql-type: TEXT
        status:
          type: string
          enum:
          - active
          - inactive
          description: active / inactive
          x-sql-type: VARCHAR(20)
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: Ngày tạo
          x-sql-type: TIMESTAMPTZ
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: Ngày sửa
          x-sql-type: TIMESTAMPTZ
