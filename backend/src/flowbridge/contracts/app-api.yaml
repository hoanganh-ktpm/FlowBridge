            request_item_id:
              $ref: '#/components/schemas/Uuid'
            input_revision:
              $ref: '#/components/schemas/Version'
        else:
          properties:
            po_item_id:
              type: 'null'
      - if:
          required:
          - request_id
          properties:
            request_id:
              type: string
        then:
          required:
          - request_item_id
          - input_revision
          properties:
            request_item_id:
