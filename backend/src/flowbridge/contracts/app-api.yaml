openapi: 3.1.0
info:
  title: Supplier Assistant Application API
  version: 0.4.1
  description: Contract theo Supplier Assistant Database Schema v0.4.1 TabICLv2 (27 bảng). Xác thực ngoài, users/roles/grants
    nội bộ. API dùng PostgreSQL; các engine chưa tích hợp trả 503.
servers:
- url: http://127.0.0.1:8000
security:
- BearerAuth: []
x-database-schema-version: 0.4.1
x-contract-status: Runtime PostgreSQL; IdP/workflow/chat/model/document adapters cần tích hợp riêng.
x-conventions:
  ids: UUID nội bộ; mã PR/SUP/PO là trường hiển thị riêng; actor từ server, không nhận role/owner tùy ý.
  decimal: Quantity và tiền NUMERIC(18,4) truyền dạng chuỗi bốn chữ số thập phân.
  time: Timestamp có timezone; ngày nghiệp vụ Asia/Ho_Chi_Minh; knowledge received_at/recorded_at < feature_asof.
  concurrency: input_revision cho PR/task; version_no/current cho proposal; không tạo cột version giả trên mọi bảng.
  authorization: EMPLOYEE owner; APPROVER/WAREHOUSE department grant; ADMIN không tự approve; AI_SERVICE/PO_SERVICE
    là service.
  documents: Adapter tới kho Markdown PostgreSQL hiện có; giữ reference/version/chunk/ACL; không tạo supplier_documents.
  idempotency: Receiver claim/replay bền vững và đối soát outcome; scope actor và fingerprint được lưu cùng transaction nghiệp vụ trong bảng api_idempotency.
