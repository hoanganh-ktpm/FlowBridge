        subject:
          type: string
          minLength: 1
          maxLength: 500
        kind:
          type: string
          enum:
          - human
          - service
        display_name:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
        service_client_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
        application_id:
          anyOf:
          - $ref: ./common.openapi.yaml#/components/schemas/UUID
