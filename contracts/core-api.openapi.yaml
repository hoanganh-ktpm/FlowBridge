        updated_at:
          $ref: ./common.openapi.yaml#/components/schemas/Timestamp
        created_by:
          anyOf:
          - $ref: ./common.openapi.yaml#/components/schemas/UUID
          - type: 'null'
        updated_by:
          anyOf:
          - $ref: ./common.openapi.yaml#/components/schemas/UUID
          - type: 'null'
        revision:
          $ref: ./common.openapi.yaml#/components/schemas/Revision
