  /api/v1/core/data-products/{data_product_id}/rows:
    get:
      operationId: readDataProductRows
      summary: Read a bounded governed Data Product projection
      description: 'Active principal and effective bindings; product ACTIVE/current contract; source CONNECTED;
        application and owner/consumer departments ACTIVE; one ACTIVE unexpired grant with applied_revision == desired_revision
        covers every requested column and business key. Never an admin-secret runtime query.. Required columns include
        all business_key fields for deterministic ascending ordering. Omitted keys: 422; insufficient grant: 403.
        Core compiles a bounded SELECT-only Hasura query from approved metadata; client supplies no raw GraphQL/SQL/role.
        No snapshot/export promise; concurrent source writes can shift offsets. Check current permissions for every
        request.'
      tags:
      - core
      x-priority: P0
      x-authorization: Active principal and effective bindings; product ACTIVE/current contract; source CONNECTED;
        application and owner/consumer departments ACTIVE; one ACTIVE unexpired grant with applied_revision == desired_revision
        covers every requested column and business key. Never an admin-secret runtime query.
      parameters:
      - $ref: ./common.openapi.yaml#/components/parameters/CorrelationId
      - name: data_product_id
        in: path
        required: true
        schema:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
      - name: contract_version_id
        in: query
        required: true
        schema:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
      - name: columns
        in: query
        required: true
        style: form
        explode: false
        schema: &id036
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 63
            pattern: ^[a-z_][a-z0-9_]*$
        description: Comma-separated selected columns including all business_key fields; one grant covers the whole
          projection.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      responses:
        '200':
          description: Success.
          headers:
            X-Correlation-Id:
              $ref: ./common.openapi.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataRows'
        '401':
          $ref: ./common.openapi.yaml#/components/responses/401
        '403':
          $ref: ./common.openapi.yaml#/components/responses/403
        '404':
          $ref: ./common.openapi.yaml#/components/responses/404
        '409':
          $ref: ./common.openapi.yaml#/components/responses/409
        '422':
          $ref: ./common.openapi.yaml#/components/responses/422
        '429':
          $ref: ./common.openapi.yaml#/components/responses/429
        '500':
          $ref: ./common.openapi.yaml#/components/responses/500
        '503':
          $ref: ./common.openapi.yaml#/components/responses/503
        '504':
          $ref: ./common.openapi.yaml#/components/responses/504
        '400':
          $ref: ./common.openapi.yaml#/components/responses/400
      x-pagination:
        mode: bounded-offset
        order: Pinned contract business_key ascending
        max_offset: 10000
        snapshot: false
