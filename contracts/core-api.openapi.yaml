    HttpRequestConfig:
      type: object
      additionalProperties: false
      required:
      - method
      - path
      - timeout_seconds
      - authentication
      - target_operation_id
      properties:
        method:
          type: string
          enum:
          - GET
          - POST
        path:
          type: string
          minLength: 1
          maxLength: 500
          pattern: ^/api/v1/(sales|warehouse|logistics)/[^?#]*$
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 120
        authentication:
          $ref: '#/components/schemas/AuthenticationConfig'
        target_operation_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z][A-Za-z0-9]*$
      description: target_operation_id identifies an operationId in domain-api.openapi.yaml. method/path must equal
        that operation including literal path placeholders. BUSINESS_API variables use {path,query,body}; exact
        parameters/body are validated against both registered input_schema_json and the target operation. Encode
        path values as individual URI segments; query uses declared OpenAPI serialization; forward body as JSON.
        No user-supplied headers/URL/auth and no template/eval DSL. Only synchronous 200/201 JSON response targets;
        activation rejects redirects/202/204/non-JSON targets.
