openapi: "3.1.1"
info:
  title: "FlowBridge Core API"
  version: "0.2.0"
  description: >-
    P0 identity bindings and registry, declarative onboarding, governed data sharing; P1 Operation/Tool
    registry. No business rows are stored centrally. Specification, not runtime evidence.
  license: {"name":"GPL-3.0-or-later","identifier":"GPL-3.0-or-later"}
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
servers: [{"url":"/"}]
x-contract-status: "REVIEW_CANDIDATE"
x-database-alignment: "PENDING_DB_ALIGNMENT"
security: [{"bearerAuth":[]}]
paths:
  "/api/v1/core/relationships": {"$ref":"./relationships.yaml#/paths/~1api~1v1~1core~1relationships"}
  "/api/v1/core/relationships/{relationship_id}": {"$ref":"./relationships.yaml#/paths/~1api~1v1~1core~1relationships~1{relationship_id}"}
  "/api/v1/core/relationships/{relationship_id}/publish": {"$ref":"./relationships.yaml#/paths/~1api~1v1~1core~1relationships~1{relationship_id}~1publish"}
  "/api/v1/core/relationships/{relationship_id}/disable": {"$ref":"./relationships.yaml#/paths/~1api~1v1~1core~1relationships~1{relationship_id}~1disable"}
  "/api/v1/core/data-products/{data_product_id}/query": {"$ref":"./relationships.yaml#/paths/~1api~1v1~1core~1data-products~1{data_product_id}~1query"}
  "/api/v1/core/me":
    get:
      operationId: "getMyContext"
      summary: "Resolve current caller identity and memberships"
      description: >-
        Authentication does not infer department or authorize resources. This endpoint does not accept
        caller-chosen context.
      tags: ["Registry"]
      x-priority: "P0"
      x-authorization-policy: "SELF_IDENTITY"
      x-authorization: >-
        Verified ACTIVE caller may read only their own resolved identity context. Core resolves
        platform_role from trusted principal state; request headers/body, group names and membership_role
        cannot assert DX-OS management authority.
      x-database-alignment: "PENDING_DB_ALIGNMENT"
      x-idempotency: "NONE_READ_ONLY"
      parameters: [{"$ref":"./common.openapi.yaml#/components/parameters/CorrelationId"}]
      responses:
        "200":
          description: "Validated JSON response."
          headers:
            X-Correlation-Id: {"$ref":"./common.openapi.yaml#/components/headers/CorrelationId"}
            Cache-Control: {"$ref":"./common.openapi.yaml#/components/headers/CacheControl"}
          content: {"application/json":{"schema":{"$ref":"./core-api.openapi.yaml#/components/schemas/ResolvedIdentityContext"}}}
        "400": {"$ref":"./common.openapi.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.openapi.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.openapi.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.openapi.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.openapi.yaml#/components/responses/Error409"}
        "422": {"$ref":"./common.openapi.yaml#/components/responses/Error422"}
        "429": {"$ref":"./common.openapi.yaml#/components/responses/Error429"}
        "500": {"$ref":"./common.openapi.yaml#/components/responses/Error500"}
        "503": {"$ref":"./common.openapi.yaml#/components/responses/Error503"}
        "504": {"$ref":"./common.openapi.yaml#/components/responses/Error504"}
  "/api/v1/core/principals":
    post:
      operationId: "createPrincipal"
      summary: "Register principal"
      description: "Register principal"
      tags: ["Registry"]
      x-priority: "P0"
      x-authorization-policy: "IT_ADMIN"
      x-authorization: >-
        ACTIVE trusted principal with platform_role=PLATFORM_ADMIN (IT). Full DX-OS control-plane authority
        across departments: registration, configuration, publish, grant/revoke and audit. No department
        OWNER membership or separate department approval required. Technical validation, resource state,
        revision and verification guards still apply; this role does not bypass normal data grants or
        Business API authorization.
      x-database-alignment: "PENDING_DB_ALIGNMENT"
      x-idempotency: "DURABLE_COMMAND"
      parameters:
        - {"$ref":"./common.openapi.yaml#/components/parameters/CorrelationId"}
        - {"$ref":"./common.openapi.yaml#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content: {"application/json":{"schema":{"$ref":"./core-api.openapi.yaml#/components/schemas/PrincipalProvision"}}}
      responses:
        "201":
          description: "Validated JSON response."
          headers:
            X-Correlation-Id: {"$ref":"./common.openapi.yaml#/components/headers/CorrelationId"}
            Idempotency-Replayed: {"$ref":"./common.openapi.yaml#/components/headers/IdempotencyReplayed"}
            Cache-Control: {"$ref":"./common.openapi.yaml#/components/headers/CacheControl"}
          content: {"application/json":{"schema":{"$ref":"./core-api.openapi.yaml#/components/schemas/Principal"}}}
        "400": {"$ref":"./common.openapi.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.openapi.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.openapi.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.openapi.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.openapi.yaml#/components/responses/Error409"}
        "422": {"$ref":"./common.openapi.yaml#/components/responses/Error422"}
        "429": {"$ref":"./common.openapi.yaml#/components/responses/Error429"}
        "500": {"$ref":"./common.openapi.yaml#/components/responses/Error500"}
        "503": {"$ref":"./common.openapi.yaml#/components/responses/Error503"}
        "504": {"$ref":"./common.openapi.yaml#/components/responses/Error504"}
    get:
      operationId: "listPrincipals"
      summary: "List visible principals"
      description: >-
        Opaque cursor bound to current caller/filter/sort, ordered by created_at,id ascending. Authorization
        rechecked on every page.
