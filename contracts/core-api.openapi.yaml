components:
  securitySchemes: {"bearerAuth":{"type":"http","scheme":"bearer"}}
  schemas:
    PrincipalProvision:
      type: "object"
      additionalProperties: false
      required: ["issuer","subject"]
      properties: {"issuer":{"type":"string","format":"uri"},"subject":{"type":"string","minLength":1,"maxLength":255}}
    Principal:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "created_at"
        - "updated_at"
        - "created_by"
        - "updated_by"
        - "revision"
        - "issuer"
        - "subject"
        - "kind"
        - "display_name"
        - "service_client_id"
        - "application_id"
        - "platform_role"
        - "status"
      properties:
        id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        created_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
        updated_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
        created_by: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        updated_by: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        revision: {"$ref":"./common.openapi.yaml#/components/schemas/Revision"}
        issuer: {"type":"string","format":"uri"}
        subject: {"type":"string","minLength":1,"maxLength":255}
        kind: {"type":"string","enum":["human","service"]}
        display_name: {"anyOf":[{"type":"string","minLength":1,"maxLength":200},{"type":"null"}]}
        service_client_id: {"anyOf":[{"type":"string","minLength":1,"maxLength":200},{"type":"null"}]}
        application_id: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        platform_role: {"type":"string","enum":["NONE","PLATFORM_ADMIN"]}
        status: {"type":"string","enum":["ACTIVE","DISABLED"]}
      allOf:
        -
          if: {"properties":{"kind":{"const":"human"}}}
          then: {"properties":{"service_client_id":{"type":"null"},"application_id":{"type":"null"}}}
        -
          if: {"properties":{"kind":{"const":"service"}}}
          then: {"properties":{"service_client_id":{"type":"string","minLength":1,"maxLength":200}}}
    PrincipalPatch:
      type: "object"
      additionalProperties: false
      required: ["expected_revision"]
      properties:
        expected_revision: {"$ref":"./common.openapi.yaml#/components/schemas/Revision"}
        display_name: {"anyOf":[{"type":"string","minLength":1,"maxLength":200},{"type":"null"}]}
        status: {"type":"string","enum":["ACTIVE","DISABLED"]}
        platform_role: {"type":"string","enum":["NONE","PLATFORM_ADMIN"]}
        application_id: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
      minProperties: 2
      description: >-
        Trusted admin only. Issuer/subject/kind/client binding immutable. Service application binding is
        IdP/config validated; human application_id must remain null.
    DepartmentCreate:
      type: "object"
      additionalProperties: false
      required: ["code","name"]
      properties:
        code: {"$ref":"./common.openapi.yaml#/components/schemas/LogicalKey"}
        name: {"type":"string","minLength":1,"maxLength":200}
        description: {"anyOf":[{"type":"string","minLength":1,"maxLength":2000},{"type":"null"}]}
    Department:
      type: "object"
      additionalProperties: false
      required: ["id","created_at","updated_at","created_by","updated_by","revision","code","name","description","status"]
      properties:
        id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        created_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
        updated_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
        created_by: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        updated_by: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        revision: {"$ref":"./common.openapi.yaml#/components/schemas/Revision"}
        code: {"$ref":"./common.openapi.yaml#/components/schemas/LogicalKey"}
        name: {"type":"string","minLength":1,"maxLength":200}
        description: {"anyOf":[{"type":"string","minLength":1,"maxLength":2000},{"type":"null"}]}
        status: {"type":"string","enum":["ACTIVE","DISABLED"]}
    DepartmentPatch:
      type: "object"
      additionalProperties: false
      required: ["expected_revision"]
      properties:
        expected_revision: {"$ref":"./common.openapi.yaml#/components/schemas/Revision"}
        name: {"type":"string","minLength":1,"maxLength":200}
        description: {"anyOf":[{"type":"string","minLength":1,"maxLength":2000},{"type":"null"}]}
        status: {"type":"string","enum":["ACTIVE","DISABLED"]}
      minProperties: 2
    MembershipUpsert:
      type: "object"
      additionalProperties: false
      required: ["principal_id","membership_role"]
      properties:
        principal_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        membership_role: {"type": "string", "enum": ["STAFF", "OWNER"], "description": "Organizational label retained for Core DB v0.2 compatibility. STAFF and legacy OWNER confer no DX-OS management, publication or approval rights."}
        expires_at: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"},{"type":"null"}]}
    Membership:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "created_at"
        - "updated_at"
        - "created_by"
        - "updated_by"
        - "revision"
        - "principal_id"
        - "department_id"
        - "membership_role"
        - "status"
        - "expires_at"
      properties:
        id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        created_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
        updated_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
        created_by: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        updated_by: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        revision: {"$ref":"./common.openapi.yaml#/components/schemas/Revision"}
        principal_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        department_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        membership_role: {"type": "string", "enum": ["STAFF", "OWNER"], "description": "Organizational label retained for Core DB v0.2 compatibility. STAFF and legacy OWNER confer no DX-OS management, publication or approval rights."}
        status: {"type":"string","enum":["ACTIVE","REVOKED"]}
        expires_at: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"},{"type":"null"}]}
    MembershipPatch:
      type: "object"
      additionalProperties: false
      required: ["expected_revision"]
      properties:
        expected_revision: {"$ref":"./common.openapi.yaml#/components/schemas/Revision"}
        membership_role: {"type": "string", "enum": ["STAFF", "OWNER"], "description": "Organizational label retained for Core DB v0.2 compatibility. STAFF and legacy OWNER confer no DX-OS management, publication or approval rights."}
        status: {"type":"string","enum":["ACTIVE","REVOKED"]}
        expires_at: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"},{"type":"null"}]}
      minProperties: 2
    ApplicationCreate:
      type: "object"
      additionalProperties: false
      required: ["department_id","app_key","name"]
      properties:
        department_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        app_key: {"$ref":"./common.openapi.yaml#/components/schemas/LogicalKey"}
        name: {"type":"string","minLength":1,"maxLength":200}
        description: {"anyOf":[{"type":"string","minLength":1,"maxLength":2000},{"type":"null"}]}
        business_api_base_url: {"anyOf":[{"type":"string","format":"uri","pattern":"^https://"},{"type":"null"}]}
    Application:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "created_at"
        - "updated_at"
        - "created_by"
        - "updated_by"
        - "revision"
        - "department_id"
        - "app_key"
        - "name"
        - "description"
        - "business_api_base_url"
        - "status"
      properties:
        id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        created_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
        updated_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
        created_by: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        updated_by: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        revision: {"$ref":"./common.openapi.yaml#/components/schemas/Revision"}
        department_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        app_key: {"$ref":"./common.openapi.yaml#/components/schemas/LogicalKey"}
        name: {"type":"string","minLength":1,"maxLength":200}
        description: {"anyOf":[{"type":"string","minLength":1,"maxLength":2000},{"type":"null"}]}
        business_api_base_url: {"anyOf":[{"type":"string","format":"uri"},{"type":"null"}]}
        status: {"type":"string","enum":["DRAFT","ACTIVE","DISABLED"]}
    ApplicationPatch:
      type: "object"
      additionalProperties: false
      required: ["expected_revision"]
      properties:
        expected_revision: {"$ref":"./common.openapi.yaml#/components/schemas/Revision"}
        name: {"type":"string","minLength":1,"maxLength":200}
        description: {"anyOf":[{"type":"string","minLength":1,"maxLength":2000},{"type":"null"}]}
        business_api_base_url: {"anyOf":[{"type":"string","format":"uri","pattern":"^https://"},{"type":"null"}]}
        status: {"type":"string","enum":["DRAFT","ACTIVE","DISABLED"]}
      minProperties: 2
      description: >-
        Cannot change base URL or move ACTIVE to DRAFT while ACTIVE BUSINESS_API operations reference it.
        DISABLED denies new execution; reactivation revalidates endpoint policy.
    SourceCreate:
      type: "object"
      additionalProperties: false
      required: ["application_id","source_key","db_type","host","port","database_name","db_user","secret_ref"]
      properties:
        application_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        source_key: {"$ref":"./common.openapi.yaml#/components/schemas/QualifiedKey"}
        db_type: {"const":"POSTGRESQL"}
        host: {"type":"string","minLength":1,"maxLength":253,"pattern":"^[A-Za-z0-9][A-Za-z0-9.-]*$"}
        port: {"type":"integer","minimum":1,"maximum":65535}
        database_name: {"type":"string","minLength":1,"maxLength":63,"pattern":"^[A-Za-z0-9_-]+$"}
        db_user: {"type":"string","minLength":1,"maxLength":100,"pattern":"^[A-Za-z0-9_.-]+$"}
        secret_ref: {"$ref":"./common.openapi.yaml#/components/schemas/SecretReference"}
        ssl_mode: {"type":"string","enum":["verify-full","verify-ca","require"],"default":"verify-full"}
      description: >-
        Admin-only approved connection proposal. No password/DSN. Server generates hasura_source_name; P0
        rejects disable TLS, validates host/egress and complete connection tuple against secret binding.
    SourcePatch:
      type: "object"
      additionalProperties: false
      required: ["expected_revision"]
      properties:
        expected_revision: {"$ref":"./common.openapi.yaml#/components/schemas/Revision"}
        host: {"type":"string","minLength":1,"maxLength":253,"pattern":"^[A-Za-z0-9][A-Za-z0-9.-]*$"}
        port: {"type":"integer","minimum":1,"maximum":65535}
        database_name: {"type":"string","minLength":1,"maxLength":63}
        db_user: {"type":"string","minLength":1,"maxLength":100}
        secret_ref: {"$ref":"./common.openapi.yaml#/components/schemas/SecretReference"}
        ssl_mode: {"type":"string","enum":["verify-full","verify-ca","require"]}
      minProperties: 2
      description: >-
        Connection changes require explicit reconnect and invalidate discovery/plan approval. Reject while
        live products/grants depend on the source. Server-generated source identity is immutable.
    Source:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "created_at"
        - "updated_at"
        - "created_by"
        - "updated_by"
        - "revision"
        - "application_id"
        - "source_key"
        - "db_type"
        - "hasura_source_name"
        - "status"
        - "last_checked_at"
      properties:
        id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        created_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
        updated_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
        created_by: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        updated_by: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        revision: {"$ref":"./common.openapi.yaml#/components/schemas/Revision"}
        application_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        source_key: {"$ref":"./common.openapi.yaml#/components/schemas/QualifiedKey"}
        db_type: {"const":"POSTGRESQL"}
        hasura_source_name: {"$ref":"./common.openapi.yaml#/components/schemas/Identifier"}
        status: {"type":"string","enum":["DRAFT","VALIDATING","CONNECTED","FAILED","DISABLED"]}
        last_checked_at: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"},{"type":"null"}]}
      description: "Redacted read DTO: never return host, port, database_name, db_user, secret_ref or environment bindings."
    ResolvedMembership:
      type: "object"
      additionalProperties: false
      required: ["department_id","membership_role","status","expires_at","department_status"]
      properties:
        department_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        membership_role: {"type": "string", "enum": ["STAFF", "OWNER"], "description": "Organizational label retained for Core DB v0.2 compatibility. STAFF and legacy OWNER confer no DX-OS management, publication or approval rights."}
        status: {"type":"string","enum":["ACTIVE","REVOKED"]}
        expires_at: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"},{"type":"null"}]}
        department_status: {"type":"string","enum":["ACTIVE","DISABLED"]}
    ResolvedIdentityContext:
      type: "object"
      additionalProperties: false
      required: ["verified_identity","principal_id","principal_status","platform_role","application_id","memberships"]
      properties:
        verified_identity: {"$ref":"./identity-context.schema.json"}
        principal_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        principal_status: {"type":"string","enum":["ACTIVE","DISABLED"]}
        platform_role: {"type":"string","enum":["NONE","PLATFORM_ADMIN"]}
        application_id: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        memberships:
          type: "array"
          items: {"$ref":"./core-api.openapi.yaml#/components/schemas/ResolvedMembership"}
          minItems: 0
          maxItems: 100
      description: >-
        Trusted resolver output only, never request authorization input. Core resolves platform_role from
        trusted principal state. PLATFORM_ADMIN controls DX-OS management; STAFF/OWNER memberships are
        organization/read-grant bindings only, never management authority. Data access and business
        operations remain independently authorized.
      allOf:
        -
          if: {"properties":{"verified_identity":{"properties":{"account_type":{"const":"human"}}}}}
          then: {"properties":{"application_id":{"type":"null"}}}
        -
          if: {"properties":{"verified_identity":{"properties":{"account_type":{"const":"service"}}}}}
          then:
            properties: {"verified_identity":{"properties":{"client_id":{"type":"string","minLength":1,"maxLength":200}}}}
    PrincipalPage:
      type: "object"
      additionalProperties: false
      required: ["items","next_cursor"]
      properties:
        items:
          type: "array"
          items: {"$ref":"./core-api.openapi.yaml#/components/schemas/Principal"}
          minItems: 0
          maxItems: 100
        next_cursor: {"anyOf":[{"type":"string","minLength":1,"maxLength":2048},{"type":"null"}]}
    DepartmentPage:
      type: "object"
      additionalProperties: false
      required: ["items","next_cursor"]
      properties:
        items:
          type: "array"
          items: {"$ref":"./core-api.openapi.yaml#/components/schemas/Department"}
          minItems: 0
          maxItems: 100
        next_cursor: {"anyOf":[{"type":"string","minLength":1,"maxLength":2048},{"type":"null"}]}
    ApplicationPage:
      type: "object"
      additionalProperties: false
      required: ["items","next_cursor"]
      properties:
        items:
          type: "array"
          items: {"$ref":"./core-api.openapi.yaml#/components/schemas/Application"}
          minItems: 0
          maxItems: 100
        next_cursor: {"anyOf":[{"type":"string","minLength":1,"maxLength":2048},{"type":"null"}]}
    SourcePage:
      type: "object"
      additionalProperties: false
      required: ["items","next_cursor"]
      properties:
        items:
          type: "array"
          items: {"$ref":"./core-api.openapi.yaml#/components/schemas/Source"}
          minItems: 0
          maxItems: 100
        next_cursor: {"anyOf":[{"type":"string","minLength":1,"maxLength":2048},{"type":"null"}]}
    MembershipPage:
      type: "object"
      additionalProperties: false
      required: ["items","next_cursor"]
      properties:
        items:
          type: "array"
          items: {"$ref":"./core-api.openapi.yaml#/components/schemas/Membership"}
          minItems: 0
          maxItems: 100
        next_cursor: {"anyOf":[{"type":"string","minLength":1,"maxLength":2048},{"type":"null"}]}
