openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: FlowBridge Agent Hub API for Web and Mobile
  version: 1.0.0
  description: |
    Hợp đồng thiết kế, chưa phải các endpoint đã triển khai. Kết quả công khai theo
    template (1).json người dùng cung cấp. API tiếp nhận/lưu/truyền yêu cầu;
    Langflow ver2 tự điều phối agent chính, gọi phụ thuộc và dựng JSON cuối.
    Đọc agent-hub/README.md cho quy tắc ngữ nghĩa, lifecycle, SSE và tích hợp.
    Bảo toàn nguyên cây agent-hub/ khi phân phối để resolve external $ref.
servers:
  - url: /
    description: Cùng origin hoặc API origin do môi trường triển khai cấu hình.
security:
  - AgentHubBearerAuth: []
tags:
  - name: Agent Hub / Agents
  - name: Agent Hub / Conversations
  - name: Agent Hub / Runs
x-contract-status: design-only; no runtime routes, database migration or Langflow graph changes in this delivery
x-result-schema-version: '1.0'
x-canonical-result-schema: agent-hub/schemas/run-result.schema.json
x-canonical-event-schema: agent-hub/schemas/run-event.schema.json
x-conventions:
  authentication: Bearer do IAM xác minh; actor, quyền và tenant nếu có lấy từ trusted server context.
  orchestration: Agent và phụ thuộc do Langflow chọn/gọi; API không lập kế hoạch hoặc tự chạy ML/RAG/Data.
  isolation: Agent selection và receipts chỉ thuộc run; không sửa graph hoặc policy global khi user đổi lựa chọn.
  ids: Hub IDs là opaque string phân biệt hoa thường; UUID nghiệp vụ từ upstream giữ nguyên, không đổi thành mã hiển thị.
  time: RFC3339 có offset; ngày nghiệp vụ theo IANA timezone của request, snapshot tại accepted_at.
  decimal: Tiền/quantity chính xác dùng decimal string; schema biểu diễn nằm ở metadata cột, không thay business DTO 0.4.1.
  result: GET run trả RunResult trực tiếp, không bọc thêm data/result hoặc text chứa JSON.
  errors: Lỗi trước admission dùng HTTP non-2xx + Problem; lỗi thực thi sau admission dùng RunResult status=failed.
  pagination: Cursor opaque, scope theo actor/filter, snapshot ổn định; không tiết lộ tổng bản ghi không có quyền.
  idempotency: POST yêu cầu Idempotency-Key; scope actor/tenant/method/path/key, retention tối thiểu 24 giờ.
paths:
  /api/v1/agent-hub/agents:
    get:
      operationId: listAgentHubAgents
      tags: [Agent Hub / Agents]
      summary: Liệt kê ba agent chính mà người dùng có quyền lựa chọn
      description: |
        Chỉ metadata, không gọi model hoặc chạy thử dịch vụ để lấy danh sách.
        unavailable không đồng nghĩa người dùng có thể vượt ACL qua dependency.
      responses:
        '200':
          description: Các agent được phép nhìn thấy; không có quyền chọn thì không xuất hiện.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentCatalog'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/agent-hub/conversations:
    get:
      operationId: listAgentHubConversations
      tags: [Agent Hub / Conversations]
      summary: Danh sách hội thoại của người dùng hiện tại
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Phân trang theo updated_at DESC, id DESC; cursor giữ snapshot danh sách.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createAgentHubConversation
      tags: [Agent Hub / Conversations]
      summary: Tạo hội thoại và lựa chọn agent chính
      description: Không gọi model; selected_agents rỗng nghĩa chỉ trung tâm, không ngầm bật cả ba agent.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateConversation'}
            example:
              title: Phân tích nhà cung cấp
              selected_agents: [prediction]
      responses:
        '201':
          description: Hội thoại đã được lưu; revision bắt đầu bằng 1.
          headers:
            Location: {$ref: '#/components/headers/Location'}
            ETag: {$ref: '#/components/headers/ETag'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/agent-hub/conversations/{conversation_id}:
    parameters:
      - {$ref: '#/components/parameters/ConversationId'}
    get:
      operationId: getAgentHubConversation
      tags: [Agent Hub / Conversations]
      summary: Lấy metadata, revision và lựa chọn agent của hội thoại
      responses:
        '200':
          description: Không bao gồm toàn bộ lịch sử tin nhắn.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateAgentHubConversation
      tags: [Agent Hub / Conversations]
      summary: Đổi tên hoặc lựa chọn agent cho lượt tiếp theo
      description: |
        Kiểm If-Match nguyên tử. Không có header trả 428; revision cũ trả 412.
        Run đang chạy giữ nguyên snapshot. Null không có nghĩa xóa lựa chọn.
        Body phải có ít nhất một trong title/selected_agents; không nhận owner/tenant/flow_id.
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateConversation'}
            example:
              selected_agents: [prediction, knowledge]
      responses:
        '200':
          description: Metadata mới; revision tăng một khi nội dung thay đổi, no-op giữ revision.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/agent-hub/conversations/{conversation_id}/messages:
    parameters:
      - {$ref: '#/components/parameters/ConversationId'}
    get:
      operationId: listAgentHubMessages
      tags: [Agent Hub / Conversations]
      summary: Lịch sử tin nhắn có phân trang
      description: |
        Mỗi run được admission tạo một user message và một assistant message.
        Assistant pending có text rỗng; terminal lấy text từ RunResult.answer.
        Trả thứ tự sequence ASC. Tải bảng/biểu đồ bằng result_url, không copy vào message.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Cursor ổn định; tải lại từ trang đầu và cập nhật theo message ID để nhận thay đổi mới.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagePage'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/agent-hub/conversations/{conversation_id}/runs:
    parameters:
      - {$ref: '#/components/parameters/ConversationId'}
    get:
      operationId: listAgentHubRuns
      tags: [Agent Hub / Runs]
      summary: Tìm lại các run khi đóng app hoặc mất kết nối
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Snapshot metadata, accepted_at DESC rồi run_id DESC.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createAgentHubRun
      tags: [Agent Hub / Runs]
      summary: Lưu tin nhắn và bắt đầu một run Langflow
      description: |
        Admission nguyên tử gồm kiểm quyền, revision, active run, idempotency,
        lưu message/run/snapshot và yêu cầu thực thi bền vững. Không chạy model
        trong HTTP request này. Mỗi conversation có tối đa một run queued/running/cancelling.
        Langflow tự gọi phụ thuộc theo policy; client không gửi dependency_agents.
        conversation_revision lệch trả 409; selected agent không khả dụng trả 503 trước admission.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRun'}
            examples:
              delivery:
                value:
                  conversation_revision: 1
                  message: Vẽ biểu đồ tỷ lệ giao trễ của các nhà cung cấp.
                  timezone: Asia/Ho_Chi_Minh
              clarification:
                value:
                  conversation_revision: 1
                  message: Tôi chọn loại băng keo vàng.
                  timezone: Asia/Ho_Chi_Minh
                  response_to_run_id: run_clarify_001
                  question_answers:
                    q_product: DEMO-P03
                    q_quantity: '100.0000'
                    q_delivery_date: '2026-10-21'
      responses:
        '202':
          description: Đã lưu bền vững; response replay giữ nguyên run_id và body lúc admission.
          headers:
            Location: {$ref: '#/components/headers/Location'}
            Retry-After: {$ref: '#/components/headers/RetryAfter'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedRun'}
              example:
                run_id: run_delivery_001
                conversation_id: conv_001
                message_id: msg_user_001
                status: queued
                result_url: /api/v1/agent-hub/runs/run_delivery_001
                metadata_url: /api/v1/agent-hub/runs/run_delivery_001/metadata
                events_url: /api/v1/agent-hub/runs/run_delivery_001/events
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/agent-hub/runs/{run_id}:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getAgentHubRunResult
      tags: [Agent Hub / Runs]
      summary: JSON chuẩn để web/app dựng câu trả lời, bảng và biểu đồ
      description: |
        Trả RunResult trực tiếp theo template, kể cả queued/running/cancelling.
        Snapshot nonterminal có answer rỗng, arrays rỗng, error null; không công bố
        bảng/biểu đồ dở dang. Terminal immutable; GET không chạy lại model.
        HTTP 200 + status failed là run đã tồn tại và thực thi thất bại.
      responses:
        '200':
          description: Snapshot đầy đủ của run thuộc quyền truy cập.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunResult'}
              examples:
                delivery: {$ref: './agent-hub/examples/openapi-examples.yaml#/delivery'}
                comparison: {$ref: './agent-hub/examples/openapi-examples.yaml#/comparison'}
                clarification: {$ref: './agent-hub/examples/openapi-examples.yaml#/clarification'}
                failed: {$ref: './agent-hub/examples/openapi-examples.yaml#/failed'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/agent-hub/runs/{run_id}/metadata:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getAgentHubRunMetadata
      tags: [Agent Hub / Runs]
      summary: Agent được chọn/đã dùng, timestamps và thông tin vận hành an toàn
      description: |
        Tách metadata khỏi RunResult để giữ nguyên template. used_agents chỉ liệt kê
        agent chuyên môn đã thực sự bắt đầu; dependency_agents là tập con used_agents
        không nằm trong selected_agents và được gọi qua dependency hợp lệ.
        Central không xuất hiện trong ba danh sách này. Không trả raw prompt/tool payload.
      responses:
        '200':
          description: Metadata theo quyền hiện tại; trạng thái có thể đã tiến thêm so với lần đọc result trước.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunMetadata'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/agent-hub/runs/{run_id}/events:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: streamAgentHubRunEvents
      tags: [Agent Hub / Runs]
      summary: Activities và câu trả lời tạm qua Server-Sent Events
      description: |
        Authorization header vẫn bắt buộc; không đưa bearer vào query string.
        Client browser dùng streaming fetch hoặc SSE client hỗ trợ header.
        Event data tuân theo RunEvent; SSE event=type, id=id. Sequence tăng theo run.
        Last-Event-ID replay các event sau ID đó rồi tail trực tiếp; có thể nhận trùng
        khi reconnect, client deduplicate theo run_id+id. Heartbeat comment mỗi 15 giây.
        Persist terminal result trước khi phát terminal event; stream đóng sau terminal.
        Cursor hết retention trả 410 EVENT_CURSOR_EXPIRED; GET result/metadata để phục hồi.
        Cursor không thuộc run trả 400 INVALID_EVENT_CURSOR. Sự cố sau khi headers đã gửi
        thì đóng stream, không chèn Problem vào event stream và không tự đổi run thành failed.
      parameters:
        - {$ref: '#/components/parameters/LastEventId'}
      responses:
        '200':
          description: UTF-8 SSE. Event schema tại x-event-schema; terminal event tham chiếu result_url.
          headers:
            Cache-Control:
              schema: {type: string, const: 'no-store, no-transform'}
            X-Accel-Buffering:
              schema: {type: string, const: 'no'}
          content:
            text/event-stream:
              schema: {type: string}
              example: |
                id: evt_000003
                event: agent.started
                data: {"schema_version":"1.0","id":"evt_000003","sequence":3,"type":"agent.started","run_id":"run_delivery_001","occurred_at":"2026-10-19T03:00:02Z","data":{"span_id":"span_database_1","parent_span_id":"span_prediction_1","agent":"database","invoked_by":"prediction","role":"dependency","label":"Đang xác minh sản phẩm"}}

          x-event-schema:
            $ref: './agent-hub/schemas/run-event.schema.json'
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/agent-hub/runs/{run_id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    post:
      operationId: cancelAgentHubRun
      tags: [Agent Hub / Runs]
      summary: Yêu cầu hủy hợp tác, không hoàn tác nghiệp vụ đã thực hiện
      description: |
        queued có thể chuyển cancelled ngay; running chuyển cancelling rồi cancelled.
        cancelled trả 200. completed/needs_input/failed trả 409 RUN_ALREADY_TERMINAL.
        Cùng key replay đúng response gốc; key mới phản ánh trạng thái hiện tại.
        Yêu cầu hủy không bảo đảm dừng được HTTP/model call đang in-flight, không rollback PR/PO.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Run đã ở cancelled hoặc được hủy trước khi thực thi.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CancelledRun'}
        '202':
          description: Đã ghi nhận yêu cầu, chờ executor xác nhận dừng.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CancellingRun'}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    AgentHubBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token người dùng từ IAM hiện có; không gửi Langflow API key hoặc service token tới client.
  parameters:
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/HubId'}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/HubId'}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor do server phát; client không tự tạo, parse hoặc dùng sang tài nguyên khác.
      schema: {type: string, minLength: 1, maxLength: 2048}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        16–128 ký tự opaque; giữ cùng key khi retry cùng ý định. Khác body cùng key -> 409
        IDEMPOTENCY_CONFLICT. Chưa chốt admission -> 409 IDEMPOTENCY_IN_PROGRESS,
        Retry-After=2. Quyền hiện tại phải được kiểm lại trước replay.
      schema: {type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag từ GET/PATCH conversation; ví dụ "1". Không hỗ trợ wildcard.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema: {$ref: '#/components/schemas/HubId'}
  headers:
    NoStore:
      description: Tất cả JSON response của namespace này dùng no-store, kể cả lỗi.
      schema: {type: string, const: no-store}
    RequestId:
      description: Correlation do server phát hoặc xác minh; không phải bearer hoặc quyền truy cập trace.
      schema: {$ref: '#/components/schemas/HubId'}
    Location:
      description: Relative URL của resource đã tạo.
      schema: {type: string, format: uri-reference}
    ETag:
      description: Revision metadata của conversation, không phải revision nghiệp vụ PR/PO.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    RetryAfter:
      description: Số giây chờ; admission mặc định 2, 429/503 có giá trị theo policy.
      schema: {type: integer, minimum: 1}
  responses:
    Problem:
      description: |
        HTTP errors trước admission hoặc khi đọc tài nguyên: 400 invalid JSON/header/cursor;
        401 unauthenticated (WWW-Authenticate Bearer); 403 thiếu quyền agent/operation;
        404 tài nguyên không tồn tại hoặc không được phép nhìn thấy;
        409 revision admission/active run/idempotency/terminal conflict;
        410 cursor hết hạn; 412 If-Match lệch; 413 payload lớn;
        422 request/semantic validation; 428 thiếu If-Match;
        429 rate limit (Retry-After); 500 lỗi nội bộ; 503 engine/admission unavailable (Retry-After).
        Không trả 200 với Problem. Không có run mới khi admission bị từ chối.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
        WWW-Authenticate:
          description: Chỉ bắt buộc cho HTTP 401.
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            error:
              code: CONVERSATION_BUSY
              message: Hội thoại đang có một lượt xử lý chưa kết thúc.
              retryable: true
              trace_id: trace_001
  schemas:
    HubId:
      $ref: './agent-hub/schemas/run-result.schema.json#/$defs/Id'
    AgentId:
      type: string
      enum: [database, prediction, knowledge]
    AgentSelection:
      type: array
      maxItems: 3
      uniqueItems: true
      items: {$ref: '#/components/schemas/AgentId'}
      description: Thứ tự không mang nghĩa ưu tiên; [] chỉ central. Không null và không tự bật cả ba khi thiếu.
    Agent:
      type: object
      additionalProperties: false
      required: [id, name, description, available]
      properties:
        id: {$ref: '#/components/schemas/AgentId'}
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, minLength: 1, maxLength: 1000}
        available: {type: boolean}
        unavailable_reason:
          type: string
          enum: [maintenance, dependency_unavailable, configuration_unavailable]
      allOf:
        - if:
            properties: {available: {const: false}}
          then:
            required: [unavailable_reason]
          else:
            not: {required: [unavailable_reason]}
    AgentCatalog:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/Agent'}
    CreateConversation:
      type: object
      additionalProperties: false
      required: [title, selected_agents]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        selected_agents: {$ref: '#/components/schemas/AgentSelection'}
    UpdateConversation:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        selected_agents: {$ref: '#/components/schemas/AgentSelection'}
    Conversation:
      type: object
      additionalProperties: false
      required: [id, title, selected_agents, revision, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/HubId'}
        title: {type: string, minLength: 1, maxLength: 200}
        selected_agents: {$ref: '#/components/schemas/AgentSelection'}
        revision: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CreateRun:
      type: object
      additionalProperties: false
      required: [conversation_revision, timezone]
      properties:
        conversation_revision: {type: integer, minimum: 1}
        message: {type: string, minLength: 1, maxLength: 20000}
        timezone:
          type: string
          minLength: 1
          maxLength: 100
          description: IANA timezone hợp lệ, ví dụ Asia/Ho_Chi_Minh hoặc Asia/Saigon; server xác minh bằng timezone database.
        response_to_run_id: {$ref: '#/components/schemas/HubId'}
        question_answers:
          type: object
          minProperties: 1
          maxProperties: 20
          propertyNames: {$ref: '#/components/schemas/HubId'}
          additionalProperties:
            type: [string, number]
            description: Key là questions[].id; number/decimal string tùy kind, không phải UUID tự suy ra từ label.
            maxLength: 2000
      anyOf:
        - required: [message]
        - required: [question_answers]
      dependentRequired:
        question_answers: [response_to_run_id]
        response_to_run_id: [question_answers]
    AcceptedRun:
      type: object
      additionalProperties: false
      required: [run_id, conversation_id, message_id, status, result_url, metadata_url, events_url]
      properties:
        run_id: {$ref: '#/components/schemas/HubId'}
        conversation_id: {$ref: '#/components/schemas/HubId'}
        message_id: {$ref: '#/components/schemas/HubId'}
        status: {const: queued}
        result_url: {type: string, format: uri-reference}
        metadata_url: {type: string, format: uri-reference}
        events_url: {type: string, format: uri-reference}
    RunResult:
      $ref: './agent-hub/schemas/run-result.schema.json'
    RunEvent:
      $ref: './agent-hub/schemas/run-event.schema.json'
    RunMetadata:
      type: object
      additionalProperties: false
      required: [run_id, conversation_id, user_message_id, assistant_message_id, status, conversation_revision, selected_agents, used_agents, dependency_agents, accepted_at, started_at, finished_at, timezone, business_date, cancellation_requested, trace_id, result_url, events_url, events_expires_at]
      properties:
        run_id: {$ref: '#/components/schemas/HubId'}
        conversation_id: {$ref: '#/components/schemas/HubId'}
        user_message_id: {$ref: '#/components/schemas/HubId'}
        assistant_message_id: {$ref: '#/components/schemas/HubId'}
        status: {enum: [queued, running, cancelling, completed, needs_input, failed, cancelled]}
        conversation_revision: {type: integer, minimum: 1}
        selected_agents: {$ref: '#/components/schemas/AgentSelection'}
        used_agents: {$ref: '#/components/schemas/AgentSelection'}
        dependency_agents: {$ref: '#/components/schemas/AgentSelection'}
        accepted_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        timezone: {type: string, minLength: 1, maxLength: 100}
        business_date: {type: string, format: date}
        cancellation_requested: {type: boolean}
        trace_id: {$ref: '#/components/schemas/HubId'}
        result_url: {type: string, format: uri-reference}
        events_url: {type: string, format: uri-reference}
        events_expires_at:
          type: [string, 'null']
          format: date-time
          description: Null khi chưa terminal; sau terminal giữ event ít nhất 24 giờ và công bố hạn chính xác.
    Message:
      type: object
      additionalProperties: false
      required: [id, run_id, sequence, role, text, question_answers, created_at, updated_at, result_url]
      properties:
        id: {$ref: '#/components/schemas/HubId'}
        run_id: {$ref: '#/components/schemas/HubId'}
        sequence: {type: integer, minimum: 1}
        role: {enum: [user, assistant]}
        text: {type: string, maxLength: 100000}
        question_answers:
          type: object
          maxProperties: 20
          propertyNames: {$ref: '#/components/schemas/HubId'}
          additionalProperties: {type: [string, number], maxLength: 2000}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        result_url: {type: [string, 'null'], format: uri-reference}
    ConversationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Conversation'}}
        next_cursor: {type: [string, 'null'], minLength: 1, maxLength: 2048}
    MessagePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Message'}}
        next_cursor: {type: [string, 'null'], minLength: 1, maxLength: 2048}
    RunPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/RunMetadata'}}
        next_cursor: {type: [string, 'null'], minLength: 1, maxLength: 2048}
    CancelledRun:
      type: object
      additionalProperties: false
      required: [run_id, status, result_url]
      properties:
        run_id: {$ref: '#/components/schemas/HubId'}
        status: {const: cancelled}
        result_url: {type: string, format: uri-reference}
    CancellingRun:
      type: object
      additionalProperties: false
      required: [run_id, status, result_url]
      properties:
        run_id: {$ref: '#/components/schemas/HubId'}
        status: {const: cancelling}
        result_url: {type: string, format: uri-reference}
    Problem:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {$ref: './agent-hub/schemas/run-result.schema.json#/$defs/Error'}
        issues:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [field, code, message]
            properties:
              field: {type: string, minLength: 1, maxLength: 200}
              code: {type: string, minLength: 1, maxLength: 100}
              message: {type: string, minLength: 1, maxLength: 1000}
