            - $ref: '#/components/schemas/ErrorResponse'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
      description: completed/partial có result; partial nêu phần tool lỗi trong warnings; failed có error và result=null.
      allOf:
        - if:
            properties:
              status:
                enum:
                  - completed
                  - partial
            required:
              - status
          then:
            properties:
              result:
                $ref: '#/components/schemas/ChatAnswer'
              error:
                type: 'null'
              finished_at:
                $ref: '#/components/schemas/Timestamp'
        - if:
            properties:
              status:
                const: failed
            required:
              - status
          then:
            properties:
              result:
                type: 'null'
              error:
                $ref: '#/components/schemas/ErrorResponse'
              finished_at:
                $ref: '#/components/schemas/Timestamp'
        - if:
            properties:
              status:
                enum:
                  - queued
                  - running
            required:
              - status
          then:
            properties:
              result:
                type: 'null'
              error:
                type: 'null'
              finished_at:
                type: 'null'
