x-security-policy:
  enforcement: Các x-required-*-scope và x-resource-policy là yêu cầu bắt buộc ở receiver; OpenAPI không tự thi
    hành. Gateway chặn external /internal/* và xóa các header ngữ cảnh nội bộ do browser tự gửi. Token người dùng
    và token dịch vụ không hoán đổi.
  contexts: 'Tool cần ServiceAuth AND đúng một UserContext hoặc JobContext. Nếu cả hai có mặt hoặc bất kỳ context
    nào sai thì từ chối, không fallback để nâng quyền. UserContext xác minh chữ ký/issuer/audience/expiry/tenant
    và caller service binding; quyền hiệu lực là giao quyền dịch vụ với quyền người dùng hiện tại. JobContext chỉ
    là id: phải đọc job phía server, tenant, initiator, scope, trạng thái và lease ở bước có tác động. Worker không
    giữ access token người dùng vô hạn.'
  resources: Kiểm tra tenant, application, ownership/department và quyền từng tài nguyên trước lọc, phân trang,
    đếm, lấy excerpt hoặc cache. 404 che tài nguyên ngoài phạm vi; 403 cho thao tác bị cấm trên tài nguyên được
    phép biết. Quyền quản trị không tự cấp quyền phê duyệt hoặc bỏ qua phân tách người lập/người duyệt.
  cache_and_history: Cache và replay chỉ trả sau xác thực/kiểm quyền hiện tại; key bao gồm tenant, scope fingerprint,
    source versions, cutoff và model/index version. Chat history, báo cáo và citation không được làm lộ lại nội
    dung sau thu hồi ACL; lọc/che phần nguồn tương ứng và báo warning. Không trả lease/fencing token trong public
    DTO.
  untrusted_content: Prompt, tool arguments, Markdown/PDF và nội dung truy xuất là dữ liệu không tin cậy; không
    được chọn URL upstream, header auth, tenant, role, SQL hoặc workflow action. Chỉ backend cấu hình allowlist
    tool, flow ID, model, dataset, email template và recipient.
  downstream_scopes: Token dịch vụ có audience từng receiver; dùng IAM delegation/token exchange hoặc credential
    binding theo registry. Comparison service cần tools:data:read, tools:prediction:run và tools:knowledge:read
    tương ứng criteria, không suy ra các scope này chỉ từ tools:comparison:run. Quyền user/job vẫn giữ nguyên khi
    gọi con. Backend cần Core data/workflow/file scopes đúng thao tác; không gửi raw user token tới bên ngoài allowlist.
x-conventions:
  identity: ID opaque theo Core Id; mã PR/SUP/PO là display_code, không suy ra quyền từ mã.
  time: Timestamp UTC kết thúc Z; ngày nghiệp vụ theo Asia/Ho_Chi_Minh. as_of do server chốt ở lần chấp nhận thao
    tác, retry giữ nguyên. Không dùng thời gian từ prompt để dựng lịch sử; không nhận cutoff tương lai. Historical
    replay chỉ worker được cấp scope.
  quantities: Chuỗi decimal tối đa bốn chữ số thập phân kèm unit; không dùng float để tính tiền.
  money: Money đồng nhất Core 0.2.0. Tính decimal; tổng dòng làm tròn half-up hai chữ số sau nhân quantity; tổng
    đơn bằng tổng dòng. Không gộp/so sánh tiền khác currency; v1 không tự đổi tỷ giá. Giá/thuế/chiết khấu ngoài
    snapshot không được tự bổ sung. Nếu quantity/total vượt miền biểu diễn Money trả 422 VALIDATION_ERROR, không
    overflow hoặc cắt phần lẻ.
  errors: Giữ ErrorResponse và bộ code của Core. Chẩn đoán chi tiết dùng details.field/reason được lọc; không thêm
    stack trace, token hoặc raw upstream response. Request sai hình dạng 400; điều kiện nghiệp vụ/thiếu dữ liệu
    422; conflict 409; phụ thuộc 503/504.
  empty: 200 với items/chunks/candidates rỗng là kết quả hợp lệ; lỗi upstream không giả thành danh sách rỗng.
  nullable: null nghĩa chưa có/không thể tính; khác 0 hoặc tiêu chí chưa được yêu cầu.
x-idempotency-policy:
  applies_to: Mọi POST có header Idempotency-Key, kể cả chat và suy luận tính phí.
  scope:
    - verified_principal_id
    - tenant_id
    - method
    - canonical_path
    - Idempotency-Key
  retention: Tối thiểu 86400 giây; không expire khi job/turn/action còn chạy, sau terminal giữ ít nhất 86400 giây.
    Hash JSON canonical giữ kiểu và thứ tự mảng. Cùng key/payload trả status/body/resource id đã chấp nhận, không
    chạy lại Agent hoặc phát thêm event.
  in_flight: 409 IDEMPOTENCY_CONFLICT, retryable=true, Retry-After=2 trước khi có durable acceptance.
  mismatch: 409 IDEMPOTENCY_CONFLICT, retryable=false khi cùng key khác payload.
  recovery: Timeout/5xx không chứng minh chưa có tác động. Đối soát outcome bền vững trước retry; key sự kiện/proposal/dispatch
    và fence revision tiếp tục bảo vệ sau TTL. Pure tool giữ cùng source snapshot/model/index/cutoff khi replay;
    key mới là phép tính mới.
  tool_isolation: Với bốn tool, scope idempotency còn gồm execution_id/caller context đã xác minh để token dịch
    vụ dùng chung không replay outcome giữa hai người dùng. JSON canonical request và manifest versions cùng tham
    gia fingerprint. Scope thu hẹp này bổ sung quy tắc Core, không nới quyền.
x-jobs-policy:
  acceptance: 202 chỉ sau ghi job/turn + outbox bền vững qua Core transaction. Location trỏ tài nguyên theo dõi;
    Retry-After gợi ý polling. Request timeout client không hủy job. v1 không có cancel công khai; worker bắt buộc
    deadline, retry budget và kết thúc hữu hạn.
  leases: Claim queued hoặc running hết lease bằng compare-and-set; lease token chỉ nội bộ, attempt tăng mỗi claim.
    Renew không tạo attempt mới. Mỗi commit kiểm tra token, expiry, attempt, request_version và trạng thái chưa
    terminal; stale worker trả 409 LEASE_EXPIRED/REQUEST_CHANGED. Public job không lộ token/worker identity.
  equivalence: Unique active analysis theo tenant + request_id + request_version + analysis policy. Hai lần bấm
    khác key khi còn active trả 409 ANALYSIS_IN_PROGRESS, details.reason chứa job id được phép xem. Replay cùng
    key trả job cũ. Đổi input bắt buộc revision mới.
  result: Job succeeded chỉ khi toàn bộ dòng có Prediction hợp lệ và báo cáo đã commit. Không dự đoán được một dòng
    thì job failed; không thay missing score bằng 0. Lỗi ML/RAG phụ trong phương án thay thế có thể tạo warning/partial
    comparison; không biến lỗi dự đoán chính thành low. Báo cáo cũ giữ nguyên, không thành kết quả mới.
  retries: Worker chỉ retry lỗi retryable=true trong budget cấu hình đóng băng vào job. Inbox dedup event_id, backoff
    có jitter; hết budget ghi terminal failed và đưa vào dead-letter/đối soát. Recovery không tự phát hành nghiệp
    vụ lần hai.
x-ml-policy:
  profile: API độc lập mô hình, không khóa DTO vào tên TabICLv2/checkpoint hoặc 19 feature của DB. feature_schema_version/model_version/preprocessing_version
    và context_dataset_version bắt buộc trong kết quả để tái hiện. Cấu hình chọn phía server.
  source: Prediction tái dùng Data Lookup và đọc đủ mọi trang lịch sử có quyền; không lấy trang đầu làm thống kê.
    Chỉ dùng record có event time và thời điểm hệ thống biết dữ liệu trước as_of, giữ version/checksum/manifest;
    loại label/kết quả tương lai và đơn đang dự đoán khỏi context. Không dùng model sau này để giả kết quả lịch
    sử.
  decisions: high iff risk_score >= threshold; low iff nhỏ hơn. Điểm/threshold phải hữu hạn trong [0,1]. calibrated_probability
    cần calibration_version và evidence đánh giá; điểm còn lại chỉ gọi là điểm rủi ro. Thống kê lịch sử không phải
    giải thích nhân quả. Thiếu lịch sử ngoài phạm vi model chấp nhận trả 422 INSUFFICIENT_DATA, model lỗi trả 503
    MODEL_UNAVAILABLE. Không tạo Prediction thành công có null/NaN score.
x-rag-policy:
  input_scope: Demo index Markdown qua Core Files, scan_status=clean; PDF gốc là nguồn tham chiếu nếu đã có bản
    Markdown được chuyển đổi có provenance. Không hứa OCR/PDF ingestion trong v1. File id/revision/checksum/dataset
    đều xác minh qua Core, không nhận URL tùy ý. Version nguồn tệp ánh xạ File.sha256 theo x-source-version-mapping.
  visibility: Index cách ly tenant/application/dataset, lọc ACL trước top_k rồi kiểm lại Core ACL, source version
    và clean trước trả text/citation. Thu hồi ACL, sửa/xóa nguồn phải chặn retrieval ngay cả khi index job chưa
    reconcile. Không leak tổng số nguồn bị cấm.
  generations: Upsert theo tenant + file_id + file_version + checksum + chunker/embedding version; publish generation
    nguyên tử sau hoàn tất. File thay đổi giữa lượt index phải fail hoặc tạo job revision mới; không trộn chunks
    cũ/mới. Delete gỡ mọi generation của file trong phạm vi, tombstone chặn đọc khi chờ xóa vật lý. Cùng payload
    không nhân đôi chunks.
  answer: Trả excerpt bounded và source ổn định; không trả raw vector, đường dẫn storage, credential hay URL download
    dài hạn. Không có chunks nghĩa chưa có bằng chứng trong phạm vi tìm kiếm; không kết luận nhà cung cấp không
    có vấn đề.
x-comparison-policy:
  evaluation: Một dòng/yêu cầu mỗi lần so sánh. Cùng quantity, unit, deadline, as_of và currency. criteria=price
    không chạy ML/RAG; delivery_risk mới gọi Prediction; internal_reviews mới gọi Retrieval. Tất cả nhà cung cấp
    phải active và cung ứng đúng product/unit.
  ranking: rank_by là thứ tự ưu tiên tiêu chí, không chứa trọng số ngầm do LLM bịa. V1 chỉ rank theo price hoặc
    delivery_risk tăng dần, tie-break supplier_id. internal_reviews trả nguồn định tính, không biến thành điểm số.
    Thiếu tiêu chí rank thì rank=null, không coi unknown là tốt nhất; expose evaluated/excluded/count/truncation.
    Giới hạn giá/budget là hard filter; missing currency/price bị excluded với lý do.
  bounds: Tối đa 20 supplier explicit, 100 candidate khi discovery, trả tối đa 20. Khi truncated=true không được
    khẳng định tốt nhất trên toàn bộ tập. Một số candidate lỗi thì status=partial; tất cả phụ thuộc bắt buộc lỗi
    trả 503/504. Tool không tự chọn thay người dùng hoặc cập nhật yêu cầu/PO.
x-consistency:
  transactions: Core Data transaction chứa records + revision + outbox; không ghi DB trực tiếp. Lưu report + job
    terminal + event trong cùng local transaction. Unique report/job và fence revision chống ghi đè. Yêu cầu thay
    đổi sau cutoff làm completion cũ trả 409 REQUEST_CHANGED; worker ghi job failed, không publish kết quả là current.
  workflow: Workflow là nguồn authoritative của quyết định. Nếu Core Data và Workflow không chung local transaction,
    dùng durable outbox/inbox + saga + reconciliation theo x-workflow-consistency của Core; không giả định distributed
    ACID. Proposal có workflow_pending cho tới khi binding instance được xác nhận; chỉ pending mới được duyệt. Projection
    ghi workflow_version cuối; approved event chỉ sau engine commit.
  po: Worker đọc lại Workflow/task binding, proposal version và snapshot được duyệt, kiểm separation of duties trước
    tạo PO. Unique proposal_id bảo đảm một PO cho một phiếu; nhiều supplier tạo nhiều phiếu cần duyệt riêng. Đổi
    giá/quantity/deadline hoặc supplier của snapshot cần phiếu mới, không sửa PO đã phát hành bằng AI. PDF lưu qua
    Core Files, phải clean và đúng snapshot/checksum trước dispatch.
  email: 'Recipient từ hồ sơ supplier đã xác minh; template và PDF thuộc cùng PO version. Durable dispatch identity;
    provider hỗ trợ idempotency thì tái dùng key. SMTP không bảo đảm exactly-once: outcome unknown phải đối soát
    trước retry. sent chỉ là provider nhận, không đồng nghĩa supplier xác nhận hoặc giao hàng.'
  confirmation: Token bí mật ngẫu nhiên, lưu hash, scope đúng một PO/action, có expiry; URL link chuyển token sang
    header và bỏ khỏi address/referrer/log. GET không có tác động. Quyết định nguyên tử + audit/outbox; replay cùng
    quyết định khi token hợp lệ trả kết quả cũ; quyết định ngược hoặc token đã revoke trả lỗi. Xác nhận PO không
    phải nhận hàng.
