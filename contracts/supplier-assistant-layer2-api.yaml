x-data-projections:
  envelope: Core Record={id,version,data,created_at,updated_at}; business fields ở data. Tầng 2 chuẩn hóa envelope
    thành DTO, không lặp id/version trong data. Những tên dưới là collection/projection ứng dụng cần đăng ký, không
