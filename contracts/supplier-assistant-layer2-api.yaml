            kind:
              const: draft_proposal
          required:
            - proposal_draft
          not:
            anyOf:
              - required:
                  - purchase_draft
              - required:
                  - analysis_draft
        - properties:
            kind:
              const: request_analysis
          required:
            - analysis_draft
          not:
            anyOf:
              - required:
                  - purchase_draft
              - required:
                  - proposal_draft
      description: Bản nháp để UI xác nhận; không phải quyền thực thi. Backend kiểm lại mọi giá trị khi nhận command.
    ChatAnswer:
      type: object
      additionalProperties: false
      required:
        - answer
        - needs_clarification
        - clarification_questions
        - sources
        - action_intents
        - warnings
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 16000
