  sha256: f3ff47f047f7f85a40a2143e80f1df466d830ed5f52fd70868165975e258c693
x-compatibility:
  relation_to_existing_sample: Bản review mới, không có cam kết tương thích wire với snapshot runtime 0.4.1. Một
    số tên route/operationId được giữ để dễ đối chiếu; chưa được thay snapshot, sinh client production hoặc tuyên
    bố endpoint đã tồn tại từ file này.
  persistence_adapter: UUID nội bộ, input_revision/version_no và decimal bốn chữ số trong schema DB hiện có cần
    adapter tường minh sang DTO này. Core Record.version là revision envelope của tài nguyên/projection, không yêu
    cầu mọi bảng có cột version. Money giữ hai chữ số như Core 0.2.0; giá trị bốn chữ số không biểu diễn chính xác
    phải bị từ chối hoặc nâng đồng bộ contract, không âm thầm làm tròn đơn giá.
  evolution: Consumer phải bỏ qua response field mới và xử lý enum chưa biết bằng trạng thái không hỗ trợ. Request
    được kiểm chặt. Đổi ý nghĩa, đơn vị, trường bắt buộc hoặc nhánh thành công cần version API mới; thay mô hình/chỉ
    mục không đổi giao diện tool.
x-boundaries:
  layer4: Web/App đăng nhập qua Core Identity, đọc danh sách/chi tiết qua Core Data, tải PDF qua Core Files, xem
    task/notification qua Core Workflow/Events. Báo cáo đầy đủ đọc qua getRiskReport để kiểm ACL nguồn; Core chỉ
    expose metadata report khi policy nguồn không thể enforce trong Core. Gọi tầng 2 cho chat và command nghiệp
    vụ; polling không chạy AI. Không đưa ServiceAuth hoặc Langflow key xuống client.
  layer3: N04/N05/N06/N07 chỉ gọi bốn tool phân tích nội bộ. Node chỉ chuyển DTO và lỗi, không chứa SQL, tính giá,
    feature engineering hoặc gửi email. Dịch vụ so sánh tái dùng Data Lookup, Prediction, Retrieval mà không gọi
    vòng lại Agent.
  automation: Worker nhận sự kiện, claim lease, gọi flow rồi commit kết quả qua API riêng. Flow không tự ghi job
    succeeded, không quyết định phê duyệt và không phát hành PO. Nạp RAG là tác vụ riêng, không phải bước bắt buộc
    mỗi lượt chat.
  purchasing: Agent chỉ đề xuất action_intents. Web/App hiển thị dữ liệu cho người dùng và dùng endpoint nghiệp
    vụ sau thao tác xác nhận rõ ràng. Phiếu đề xuất cần người có quyền phê duyệt; chỉ PO worker được phát hành/gửi
    đơn sau guard Workflow.
