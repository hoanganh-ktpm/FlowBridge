    AnalysisJob:
      type: object
      additionalProperties: false
      required:
        - job_id
        - purchase_request_id
        - request_version
        - status
        - trigger
        - as_of
        - policy_version
        - attempt
        - report_id
        - error
        - created_at
        - finished_at
      properties:
        job_id:
          $ref: '#/components/schemas/Id'
        purchase_request_id:
          $ref: '#/components/schemas/Id'
        request_version:
          $ref: '#/components/schemas/Version'
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        trigger:
          type: string
          enum:
            - manual
            - purchase_request.created
            - purchase_request.revised
        as_of:
          $ref: '#/components/schemas/Timestamp'
        policy_version:
          type: string
          minLength: 1
          maxLength: 128
        attempt:
          type: integer
          minimum: 0
        report_id:
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
      allOf:
        - if:
            properties:
              status:
                const: succeeded
            required:
              - status
          then:
            properties:
              report_id:
                $ref: '#/components/schemas/Id'
              error:
                type: 'null'
              finished_at:
                $ref: '#/components/schemas/Timestamp'
        - if:
            properties:
              status:
                const: failed
            required:
              - status
          then:
            properties:
              report_id:
                type: 'null'
              error:
                $ref: '#/components/schemas/ErrorResponse'
              finished_at:
                $ref: '#/components/schemas/Timestamp'
        - if:
            properties:
              status:
                enum:
                  - queued
                  - running
            required:
              - status
          then:
            properties:
              report_id:
                type: 'null'
              error:
                type: 'null'
              finished_at:
                type: 'null'
