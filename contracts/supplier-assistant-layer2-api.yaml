x-ml-runtime-contract:
  version: 1.0.0
  status: implemented; deployment requires configuration
  enable: FLOWBRIDGE_ML_ENABLED=true; database + IdP + checkpoint/context
  scope: Phụ lục ML đã triển khai. Các route cũ còn là thiết kế; không thay wire contract app/AI 0.4.1.
  overrides: Với năm route ML, dùng quy ước và security tại phụ lục/operation ML; không áp payload,
    UserContext/JobContext hoặc chuẩn Money của các tool thiết kế cũ vào route ML.
  repository: ML runtime tái sử dụng repository PostgreSQL/SQLAlchemy và policy của backend hiện có;
    custom node chỉ gọi HTTP API.
  identity: RFC7662 bearer introspection + issuer/subject mapping + active DB grants. Một application DB; chưa multi-tenant.
    Không nhận X-User-Context/JobContext cho các route ML này.
  po_aggregation: MAX các điểm hợp lệ của món còn phải giao, kèm cùng item/deadline; món thiếu làm is_complete=false.
  idempotency: 'PO POST: scope=verified actor + operation/order UUID + Idempotency-Key. Commit predictions và response
    nguyên tử; kiểm quyền lại khi replay. Không body; key mới để chấm lại.'
  probability: risk_score chưa hiệu chuẩn. score_is_calibrated=false; calibrated_late_probability=null.
  features:
    schema: '#/components/schemas/MLFeatureInput'
    count: 19
    categorical:
    - prediction_stage
    - supplier_id
    - product_category
    - confirmation_state
    source: Backend lấy DB và tính features; không đưa RAG/free text/y vào X.
  readiness: GET /_ops/ml/ready; probe vận hành riêng, không phải tool Agent.
  not_implemented: Chưa scheduler/alert, calibration, dự đoán ngày giao chính xác hoặc RAG trong các endpoint ML.
