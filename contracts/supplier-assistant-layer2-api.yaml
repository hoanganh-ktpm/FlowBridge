      - is_complete
      - items
      title: OrderRisk
      description: 'MAX điểm hợp lệ của các PO item còn phải giao; highest_risk_item_id và deadline thuộc cùng món.
        Đây là điểm đại diện, không phải xác suất ít nhất một món bị trễ. success: đủ điểm cho mọi món mở; partial:
        chỉ một số món có điểm; insufficient_data: không món mở nào có điểm; no_open_items: không còn món phải giao,
        risk/item/deadline đại diện null. is_complete=false khi có món chưa chấm được, không thay món thiếu bằng 0.'
    MLRankRequest:
      properties:
        product_id:
          type: string
          format: uuid
          title: Product Id
        quantity:
          type: string
          description: Decimal hữu hạn > 0, precision 18, scale <= 4; cùng unit sản phẩm.
          examples:
          - '100'
          - '10.5000'
          x-decimal-precision: 18
          x-decimal-scale: 4
        requested_delivery_date:
          type: string
          format: date
          title: Requested Delivery Date
