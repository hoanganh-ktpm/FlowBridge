        trong hai phiếu active. Mọi selection thuộc request revision, report phải cùng revision và có quyền xem;
        giá hiện hành phải khớp offer version. Report là căn cứ, không tự cấp quyền đặt hàng. Server chốt snapshot
        trước gửi duyệt.
