            - type: 'null'
        warnings:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Warning'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
      allOf:
        - if:
            properties:
              status:
                const: succeeded
            required:
              - status
          then:
            properties:
              index_version:
                type: string
                minLength: 1
              error:
                type: 'null'
              finished_at:
                $ref: '#/components/schemas/Timestamp'
        - if:
            properties:
              status:
                const: failed
            required:
              - status
          then:
            properties:
              error:
                $ref: '#/components/schemas/ErrorResponse'
              finished_at:
                $ref: '#/components/schemas/Timestamp'
        - if:
            properties:
              status:
                enum:
                  - queued
                  - running
            required:
              - status
          then:
            properties:
              index_version:
                type: 'null'
              error:
                type: 'null'
              finished_at:
                type: 'null'
