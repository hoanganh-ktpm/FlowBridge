            code: UPSTREAM_TIMEOUT
            message: Dịch vụ phụ thuộc vượt thời gian chờ.
            request_id: REQ-001
            retryable: true
      headers:
        X-Correlation-Id:
          description: Mã truy vết receiver tạo/chuẩn hóa.
