openapi: 3.1.0
info:
  title: Supplier Assistant Layer 2 Service Contract
  version: 0.2.0
  description: |-
    Hợp đồng tầng 02 API Tools trong sơ đồ Supplier Assistant, phục vụ tầng 03
    Langflow/custom nodes và tầng 04 Web/App. Tầng 2 gồm API nghiệp vụ, cầu nối
    Langflow, công cụ đọc dữ liệu/ML/RAG/so sánh và giao diện worker bền vững.
    Đây là bản thiết kế độc lập để review trước triển khai, không thay snapshot
    app-api.yaml/ai-tools-api.yaml đang được runtime PostgreSQL sử dụng.
    Phụ lục ML v1 bổ sung năm endpoint đã triển khai; xem x-ml-runtime-contract.
    Endpoint ML dùng URL backend cổng 8000 và cơ chế bearer/role ghi tại từng operation.

    OpenCore 0.2.0 là tầng nền: Identity, Structured Data, Files, Workflow,
    Events, Notifications và Audit. Tầng 2 dùng các API này, không truy vấn SQL
    trực tiếp, không viết lại IAM/workflow/storage và không mở tool nội bộ cho browser.
    Các collection, projection và workflow mua hàng do ứng dụng đăng ký, không phải
    nghiệp vụ hardcode của OpenCore. Một yêu cầu có nhiều dòng; ML và so sánh chạy
    theo dòng, báo cáo tự động tổng hợp đủ các dòng của cùng revision.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://localhost:8001
    description: URL ví dụ; public route qua Gateway, internal route chỉ trong mạng dịch vụ.
security:
  - BearerAuth: []
x-contract-status: design-with-implemented-ml-extension; xem x-ml-runtime-contract
x-architecture-layer: 02 API Tools; không nhầm với cách đánh số không gian ứng dụng DX-OS
