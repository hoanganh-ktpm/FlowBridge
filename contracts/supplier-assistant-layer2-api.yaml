x-source-version-mapping:
  structured_data: source_version là chuỗi của Core Record.version, source_id là record id; không yêu cầu thêm cột
    version trong bảng vật lý.
  files: Core File không công bố field version. Với nguồn tệp trong v1, source_version và pdf_version là sha256
    mà getFile trả về; checksum phải bằng giá trị này. Không giả định có endpoint file revisions hoặc download theo
    version chưa tồn tại ở Core. Nếu thay nội dung, đăng ký file id mới hoặc phát hiện sha256 đổi và vô hiệu generation
    cũ.
  prediction: source_version là model_version cùng prediction id; execution manifest giữ feature/preprocessing/context
    versions. source_id truy ngược outcome được ghi phía server.
  derived_markdown: Markdown và PDF gốc có file ids/checksums riêng. Liên kết provenance lưu trong application data/metadata
    đã xác minh qua Core, không suy ra từ tên file hoặc tự đặt page locator.
