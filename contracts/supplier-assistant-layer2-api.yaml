  rule: Các component trên được chép nguyên định nghĩa từ contract tầng 1 để file này tự chứa. Đối chiếu cấu trúc
    khi nâng version; không dùng bản runtime đóng gói khác byte làm nguồn thay thế ngầm. Schema riêng là DTO dịch
