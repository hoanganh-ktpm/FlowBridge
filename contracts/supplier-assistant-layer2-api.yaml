x-acceptance-scenarios:
  - case: Retry cùng chat key
    expect: Cùng turn id, một user message, không gọi Agent lần hai.
  - case: Service token hợp lệ nhưng UserContext giả/sai tenant
    expect: 401/403/404 theo policy; không fallback ServiceAuth-only hoặc leak tổng/excerpt.
  - case: ML score đúng bằng threshold
    expect: risk_level=high; score missing/NaN không qua success schema hoặc gate.
  - case: ML thiếu lịch sử hoặc model lỗi
    expect: 422 INSUFFICIENT_DATA hoặc 503 MODEL_UNAVAILABLE; không gán low; job chính failed.
  - case: criteria chỉ price
    expect: Không gọi Prediction/Retrieval; criterion khác not_requested; rank dựa giá cùng currency.
  - case: Một supplier ML lỗi khi so sánh
    expect: partial, prediction=null, criterion unavailable, rank=null nếu rank cần risk; không bịa score.
  - case: Thu hồi ACL hoặc sửa/xóa file khi index còn stale
    expect: Không trả đoạn/text/summary bị cấm; tombstone chặn đọc trước reconcile.
  - case: Request đổi revision khi flow chạy hoặc worker cũ hoàn tất sau reclaim
    expect: 409 REQUEST_CHANGED/LEASE_EXPIRED; không publish current report hoặc overwrite kết quả mới.
  - case: Workflow đã duyệt nhưng app projection chậm
    expect: Receipt projection pending; bridge reconcile; PO worker đọc authoritative trước cấp tác động.
  - case: Email timeout không rõ provider nhận
    expect: unknown, không retry mù, không tạo PO thứ hai; đối soát trước gửi lại.
  - case: Email scanner GET link xác nhận
    expect: Không đổi trạng thái. Hai POST ngược quyết định chỉ một commit, request còn lại 409.
  - case: Một request nhiều dòng, một dòng thiếu dự đoán
    expect: Không report succeeded giả; giữ report cũ và ghi failed theo policy.
  - case: Hỏi tiếp hoặc mất quyền nguồn trong phiên chat
    expect: Chỉ một turn active; needs_clarification có câu hỏi và không có action_intent; đọc lại vẫn kiểm ACL,
      không dùng history làm quyền truy cập.
