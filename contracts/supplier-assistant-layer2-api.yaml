    proposals: Proposal
    purchase_orders: PurchaseOrder
    analysis_jobs: AnalysisJob
    email_logs: DispatchView
  reads: Đọc các projection bằng Core Data id/filter/pagination, task/instance qua Core Workflow, thông báo qua
    Core Notifications. risk_assessments ở Core chỉ expose metadata nếu không enforce ACL từng source; report đầy
    đủ đi qua getRiskReport hoặc Data Lookup. Chat không có public raw collection bypass ACL. DTO không thay việc
    đăng ký collection schema, policy, business keys và lifecycle với Core.
  materialization: Projection application ánh xạ từ schema DB hiện có qua Core adapter. Header/dòng không bắt buộc
    thành bảng mới theo tên DTO. Aggregate snapshot và outbox phải commit nguyên tử trong một Core transaction,
    không chia thành nhiều commit để vượt giới hạn 50 operations của Core. Giới hạn lô phải kiểm trước acceptance
    nếu adapter cần nhiều operations hơn cho cùng aggregate.
  line_identity: Mỗi revision trả item_id phía server và client_line_id để UI map lại. Giữ item_id với client_line_id
    đã có khi chỉnh sửa dòng chưa ràng buộc phiếu; dòng mới cấp id mới, dòng bỏ giữ trong history revision cũ. Mọi
    SavedItemRef luôn kèm request version; không dùng item_id đơn lẻ làm input đầy đủ.
x-execution-policy:
  binding: 'Mỗi chat turn hoặc analysis job có execution manifest bền vững do backend/worker tạo: execution_id,
    tenant, principal/scope, as_of, deadline, model/feature/preprocessing/context dataset/threshold/index profile
    versions. UserContext chứa execution_id được ký và đối chiếu manifest; JobContext phân giải manifest từ job.
    Không tạo manifest từ prompt.'
  fanout: Data Lookup/Prediction/Retrieval/Comparison dùng cùng context đã xác minh; lời gọi con giữ execution_id/cutoff
    và giảm deadline còn lại. Không lấy clock mới mỗi fanout, không mở rộng scope, không dùng ServiceAuth-only thay
    caller context. Scenario tính thời gian từ cutoff tới delivery_date theo lịch nghiệp vụ versioned.
  snapshots: snapshot_id của Data Lookup ràng buộc execution_id/resource/selectors/page_size/ACL; hết hạn không
    nối bằng dữ liệu mới. Model/index snapshot giữ ít nhất tới deadline và retry window. ACL hiện tại vẫn kiểm lại
    dù snapshot cũ.
  replay: Tái hiện lịch sử cần snapshot/manifest còn lưu và scope analysis:replay riêng; không cho user sửa cutoff.
    V1 không công bố endpoint chạy lịch sử tùy ý.
x-service-budgets:
  limits: 'Trần cấu hình: lookup/retrieval 10s, prediction 30s, comparison 60s, flow 120s; chat turn 180s, analysis
    job 900s. Khi deadline cha ngắn hơn thì dùng phần còn lại. Quá budget trả UPSTREAM_TIMEOUT, không báo kết quả
    dở là thành công.'
  concurrency: Một active turn/session; tin nhắn mới khác key khi active trả 409 INVALID_STATE với turn id được
    phép xem. Có giới hạn fanout/concurrency, không chạy Agent vô hạn. Worker renew lease khi chờ flow; không gia
    hạn quá deadline.
  versioning: Budget, retry budget và profile versions đóng băng trong manifest; cấu hình có thể nhỏ hơn trần, không
    âm thầm đổi giữa retry.
x-contract-invariants:
  - client_line_id và item_id unique trong request; một currency mỗi phiếu/PO; total khớp quy tắc decimal.
  - SavedItemRef.item_id thuộc purchase_request_id và expected_version; không pha scenario với saved_item.
  - Prediction.risk_level khớp so risk_score/threshold; FeatureValue.name unique theo feature_schema_version; value=null
    phải có missing_reason và ngược lại.
  - Report item ids đúng bằng tập dòng request revision, không thiếu/trùng; scenario/as_of/versions khớp manifest.
    Report high khi bất kỳ dòng high.
  - ComparisonCandidate có đủ ba CriterionResult khác tên; not_requested không có prediction/chunks; available delivery_risk
    cần prediction. Rank chỉ cho candidate đủ rank_by, unique và liên tiếp.
  - Chat partial phải có warning phần thiếu; câu trả lời giá/rủi ro/đánh giá phải có source đúng tool outcome.
  - ConfirmationPreview.can_decide chỉ true khi awaiting_confirmation và token hợp lệ. Public DTO không chứa lease/token,
    email nội bộ hoặc ACL bí mật.
x-report-policy:
  visibility: Report lưu bất biến; GET/facade có thể che text/source vừa mất quyền và thêm warning SOURCE_REDACTED.
    Không ghi đè bản gốc để redaction. Nếu không thể che mà vẫn bảo toàn DTO và quyền thì trả 403/404, không rò
    nội dung trong summary/features.
  current: Current report là report từ job thành công mới nhất có đúng request_version và policy version hiện hành.
    Truy vấn lịch sử giữ report id cũ và nhãn revision; không tạo current record bằng cách sửa report cũ.
  lineage: Flow output có thể bị LLM sửa hoặc hallucinate; receiver phải đối chiếu Prediction ids/scenarios và source
    ids với outcome trong manifest, kiểm cutoff/model/threshold/version và risk gate phía server trước commit.
x-ordering-policy:
  dispatch: issueApprovedPurchaseOrder tạo durable pending dispatch và PO. Dispatch claim không đổi approved snapshot.
    PDF có application binding và approved snapshot digest; sender xác minh clean/checksum trước gửi và đối soát
    registry dispatch. Callback outcome chỉ ghi log/status, không thể tự cấp quyền gửi.
  unknown: Khi timeout gửi hoặc lease hết sau bắt đầu gửi, reaper/đối soát provider đưa attempt vào unknown. Chỉ
    service scope orders:reconcile được cập nhật unknown thành sent hoặc failed qua recordOrderDispatch kèm cùng
    dispatch_id/attempt và evidence registry phía server; lúc đó không dùng lease hết hạn để cấp quyền gửi lại.
    Mọi endpoint cho phép nhánh này phải kiểm scope bổ sung và audit. Không expose thao tác này cho LLM.
  confirmation_race: Một PO cùng lúc chỉ một quyết định xác nhận. Trang/link có thể được nhận trước callback sent;
    API đối soát dispatch provider nếu có outcome đã xác minh, nếu chưa có thì can_decide=false và 409 INVALID_STATE,
    không tự coi đã sent. Callback đến sau confirmed chỉ cập nhật attempt log, giữ order status confirmed.
x-events:
  envelope:
    $ref: '#/components/schemas/Event'
  delivery: At-least-once, thứ tự chỉ theo aggregate; inbox dedup tenant/event_id. Trùng id khác payload hoặc version
    xung đột phải quarantine/audit, không drop im lặng. Consumer stale event đối soát state authoritative trước
    ack; gap version thì hoãn/reconcile, không skip guard.
  publication: Producer không POST lại cùng event để giả outbox. Ghi local outbox cùng commit rồi dispatcher gọi
    Core publishEvent; event_type/schema_version có registry allowlist. tenant/producer từ server. aggregate_id/version
    khớp record nêu trong data; không chứa token, full report, email body hoặc tài liệu nguồn.
  workflow_bridge: Workflow approval và app projection có thể khác local transaction. Workflow commit decision/outbox
    trước; bridge reconcile proposal, sau đó phát domain event với proposal_version. PO worker vẫn kiểm Workflow
    authoritative trước tác động. Không lấy thứ tự đến của notification làm bằng chứng phê duyệt.
  catalog:
    - type: purchase_request.created
      schema:
        $ref: '#/components/schemas/PurchaseRequestCreatedEvent'
      producer: purchasing-service
      consumer: risk-worker
      guard: Request revision đã commit; register job theo event_id.
    - type: purchase_request.revised
      schema:
        $ref: '#/components/schemas/PurchaseRequestRevisedEvent'
      producer: purchasing-service
      consumer: risk-worker
      guard: Revision mới đã commit; không dùng event cũ cho input mới.
    - type: analysis.requested
      schema:
        $ref: '#/components/schemas/AnalysisRequestedEvent'
      producer: analysis-service
      consumer: risk-worker
      guard: Job queued và manifest đã commit; claim đúng job.
    - type: analysis.completed
      schema:
        $ref: '#/components/schemas/AnalysisCompletedEvent'
      producer: analysis-service
      consumer: notification-service
      guard: Report/job succeeded đã commit cùng transaction; notification theo scope.
    - type: analysis.failed
      schema:
        $ref: '#/components/schemas/AnalysisFailedEvent'
      producer: analysis-service
      consumer: notification-service
      guard: Job terminal failed, lỗi lọc; không thay report cũ.
    - type: proposal.submitted
      schema:
        $ref: '#/components/schemas/ProposalSubmittedEvent'
      producer: proposal-service
      consumer: workflow-binding-worker
      guard: Snapshot/workflow_pending đã commit; startWorkflow business key unique.
    - type: proposal.approved
      schema:
        $ref: '#/components/schemas/ProposalApprovedEvent'
      producer: workflow-adapter
      consumer: po-worker
      guard: Engine authoritative đã commit approved; event aggregate version khớp projection proposal đã reconcile;
        receiver đọc lại engine.
    - type: proposal.rejected
      schema:
        $ref: '#/components/schemas/ProposalRejectedEvent'
      producer: workflow-adapter
      consumer: notification-service
      guard: Quyết định rejected và lý do đã ghi ở Workflow; không phát hành PO.
    - type: purchase_order.issued
      schema:
        $ref: '#/components/schemas/PurchaseOrderIssuedEvent'
      producer: ordering-service
      consumer: po-worker
      guard: PO preparing và durable dispatch pending đã commit; dựng PDF rồi claim dispatch.
    - type: purchase_order.email_dispatched
      schema:
        $ref: '#/components/schemas/PurchaseOrderEmailDispatchedEvent'
      producer: ordering-service
      consumer: notification-service
      guard: Outcome được đối soát và log đã commit; sent không nghĩa confirmed.
    - type: supplier_confirmation.recorded
      schema:
        $ref: '#/components/schemas/SupplierConfirmationRecordedEvent'
      producer: confirmation-service
      consumer: notification-service
      guard: Decision/order/audit/outbox commit; không tạo receipt giao hàng.
x-state-machines:
  analysis_job:
    transitions:
      - 'queued -> running: claim lease'
      - 'running -> running: renew hoặc reclaim lease hết hạn với attempt mới'
      - 'running -> succeeded: report validated và commit'
      - 'running -> failed: hết retry/deadline hoặc request changed'
    terminal:
      - succeeded
      - failed
    rule: Không chạy lại terminal job; manual reanalysis tạo job mới với key mới.
  chat_turn:
    transitions:
      - queued -> running -> completed
      - running -> partial
      - 'queued/running -> failed: deadline hoặc dependency error'
    rule: completed có thể needs_clarification=true. Partial phải ghi warning, không có action intent dựa trên input
      thiếu.
  proposal:
    transitions:
      - 'workflow_pending -> pending: binding instance thành công'
      - 'workflow_pending -> workflow_failed: retry budget hết'
      - 'workflow_failed -> workflow_pending: tác vụ đối soát được cấp quyền, cùng business key'
      - 'pending -> approved hoặc rejected: authoritative Workflow decision'
    rule: Mỗi line chỉ có một proposal active (workflow_pending/pending/approved); rejected giải phóng reservation.
      approved giữ reservation tới PO, không phát hành lại.
  request_projection:
    rule: 'Trạng thái từng dòng nằm trong PurchaseRequestLine.workflow_status/analysis_status/proposal_id/order_id.
      Status tổng: ordered khi mọi dòng ordered; nếu còn bất kỳ pending_approval thì pending_approval; approved
      khi mọi dòng thuộc approved/ordered và chưa tất cả ordered; rejected khi không có dòng pending/approved và
      có dòng rejected; còn lại open. Không dùng status tổng để cấp quyền phát hành PO.'
  purchase_order:
    transitions:
      - 'preparing -> awaiting_confirmation: email sent đã xác minh'
      - 'awaiting_confirmation -> confirmed hoặc rejected: supplier token decision'
    rule: Không có delivered trong v1; email_status có lifecycle riêng pending/sent/failed/unknown. confirmed/rejected
      không bị callback muộn ghi đè.
