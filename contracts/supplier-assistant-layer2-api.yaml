      tags:
        - Supplier confirmation
      summary: Xác nhận hoặc từ chối PO
      description: 'TH10. Token hợp lệ và PO awaiting_confirmation; rejected cần lý do. Decision + order state +
        audit/outbox supplier_confirmation.recorded nguyên tử. Token còn hiệu lực: cùng quyết định trả kết quả cũ
        dù key khác; quyết định ngược trả 409 INVALID_STATE. Sai/hết hạn token trả 401 TOKEN_INVALID/TOKEN_EXPIRED.
        confirmed không phải đã giao hàng.'
      security:
        - ConfirmationToken: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: order_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Kết quả hợp lệ; kiểm quyền khi replay.
          headers:
            X-Correlation-Id:
              description: Mã truy vết chuẩn hóa.
              schema:
                $ref: '#/components/schemas/Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierConfirmation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      x-resource-policy: Đúng một PO; idempotency principal là capability id server, không lưu raw token.
      x-visibility: supplier-token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationDecision'
            example:
              decision: confirmed
components:
  schemas:
    MLCandidate:
      properties:
        supplier_id:
          type: string
          format: uuid
          title: Supplier Id
        supplier_name:
          type: string
          title: Supplier Name
        unit_price:
          type: string
          title: Unit Price
        currency:
          type: string
          title: Currency
        quoted_lead_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Quoted Lead Days
          description: Lead time báo giá tham khảo từ DB, không phải ngày giao do model dự đoán.
        rank:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rank
        result:
          $ref: '#/components/schemas/MLRiskResult'
        reason_codes:
          items:
            type: string
          type: array
          title: Reason Codes
      additionalProperties: false
      type: object
      required:
      - supplier_id
      - supplier_name
      - unit_price
      - currency
      - quoted_lead_days
      - result
      title: Candidate
    MLErrorCode:
      type: string
      enum:
      - UNAUTHENTICATED
      - FORBIDDEN
      - NOT_FOUND
      - VALIDATION_ERROR
      - VERSION_CONFLICT
      - IDEMPOTENCY_CONFLICT
      - INVALID_STATE
      - INSUFFICIENT_DATA
      - MODEL_UNAVAILABLE
      - UPSTREAM_UNAVAILABLE
      - UPSTREAM_TIMEOUT
      - RATE_LIMITED
      - TOKEN_EXPIRED
      - TOKEN_INVALID
      - ANALYSIS_IN_PROGRESS
      - LEASE_EXPIRED
      - REQUEST_CHANGED
      - REPORT_MISMATCH
      - INTERNAL_ERROR
      title: ErrorCode
    MLErrorDetail:
      properties:
        field:
          type: string
          title: Field
        reason:
          type: string
          title: Reason
      additionalProperties: false
      type: object
      required:
      - field
      - reason
      title: ErrorDetail
    MLErrorResponse:
      properties:
        code:
          $ref: '#/components/schemas/MLErrorCode'
        message:
          type: string
          maxLength: 2000
          minLength: 1
          pattern: \S
          title: Message
        request_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          title: Request Id
        retryable:
          type: boolean
          title: Retryable
        details:
          items:
            $ref: '#/components/schemas/MLErrorDetail'
          type: array
          title: Details
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - request_id
      - retryable
      title: ErrorResponse
    MLItemRisk:
      properties:
        po_item_id:
          type: string
          format: uuid
          title: Po Item Id
        product_id:
          type: string
          format: uuid
          title: Product Id
        requested_delivery_date:
          type: string
          format: date
          title: Requested Delivery Date
        result:
          $ref: '#/components/schemas/MLRiskResult'
        trace:
          anyOf:
          - $ref: '#/components/schemas/MLTrace'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - po_item_id
      - product_id
      - requested_delivery_date
      - result
      title: ItemRisk
    MLOrderRisk:
      properties:
        purchase_order_id:
          type: string
          format: uuid
          title: Purchase Order Id
        aggregation_policy:
          type: string
          const: max_open_item_v1
          title: Aggregation Policy
          default: max_open_item_v1
        status:
          type: string
          enum:
          - success
          - partial
          - insufficient_data
          - no_open_items
          title: Status
        representative_risk_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Representative Risk Score
          minimum: 0
          maximum: 1
        highest_risk_item_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Highest Risk Item Id
        highest_risk_item_deadline:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Highest Risk Item Deadline
        score_is_calibrated:
          type: boolean
          const: false
          title: Score Is Calibrated
          default: false
        is_complete:
          type: boolean
          title: Is Complete
