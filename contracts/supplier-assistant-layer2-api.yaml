        clarification_questions:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 1000
        sources:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SourceRef'
        action_intents:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ActionIntent'
        warnings:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Warning'
      allOf:
        - if:
            properties:
              needs_clarification:
                const: true
            required:
              - needs_clarification
          then:
            properties:
              clarification_questions:
                minItems: 1
              action_intents:
                maxItems: 0
          else:
            properties:
              clarification_questions:
                maxItems: 0
