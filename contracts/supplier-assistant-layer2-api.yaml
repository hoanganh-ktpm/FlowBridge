  securitySchemes:
    MLBearerAuth:
      type: http
      scheme: bearer
      description: Token được xác minh qua IdP RFC7662; loại actor và quyền lấy từ DB. PO write yêu cầu service AI_SERVICE,
        không truyền credential xuống browser.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token từ Identity/SSO của OpenCore. Kiểm tra issuer, audience, expiry và quyền đối với
        tài nguyên.
    ServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token dịch vụ từ IAM; scope và tenant được kiểm tra ở dịch vụ nhận. Không phân phối token dịch
        vụ cho Web/App.
    UserContext:
      type: apiKey
      in: header
      name: X-User-Context
      description: JWT ngữ cảnh được ký bởi backend/issuer tin cậy, không phải JSON actor/role từ prompt. Xác minh
        signature, audience, tenant và expiry.
    JobContext:
      type: apiKey
      in: header
      name: X-Analysis-Job-Id
      description: Mã job chỉ là tham chiếu ngữ cảnh, không tự cấp quyền. Kèm ServiceAuth; dịch vụ đọc job từ OpenCore,
        kiểm tra tenant, principal khởi tạo và scope trước khi dùng dữ liệu.
    ConfirmationToken:
      type: apiKey
      in: header
      name: X-Confirmation-Token
      description: Token bí mật đúng một PO, có expiry/revocation; không phải IAM token; luôn dùng HTTPS ngoài local.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/Id'
      description: Mã truy vết, không phải quyền truy cập.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Key ổn định cho một thao tác ghi; retry dùng lại key.
  responses:
    BadRequest:
      description: Request không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: Request không hợp lệ.
            request_id: REQ-001
            retryable: false
      headers:
        X-Correlation-Id:
          description: Mã truy vết receiver tạo/chuẩn hóa.
          schema:
            $ref: '#/components/schemas/Id'
    Unauthorized:
      description: Thiếu hoặc sai thông tin xác thực.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHENTICATED
            message: Thiếu hoặc sai thông tin xác thực.
            request_id: REQ-001
            retryable: false
      headers:
        X-Correlation-Id:
          description: Mã truy vết receiver tạo/chuẩn hóa.
          schema:
            $ref: '#/components/schemas/Id'
    Forbidden:
      description: Không có quyền trong tenant hoặc tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN
            message: Không có quyền trong tenant hoặc tài nguyên.
            request_id: REQ-001
            retryable: false
      headers:
        X-Correlation-Id:
          description: Mã truy vết receiver tạo/chuẩn hóa.
          schema:
            $ref: '#/components/schemas/Id'
    NotFound:
      description: Không tìm thấy tài nguyên được phép truy cập.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: Không tìm thấy tài nguyên được phép truy cập.
            request_id: REQ-001
            retryable: false
      headers:
        X-Correlation-Id:
          description: Mã truy vết receiver tạo/chuẩn hóa.
          schema:
            $ref: '#/components/schemas/Id'
    Conflict:
      description: Sai trạng thái, phiên bản, key retry hoặc yêu cầu đang được xử lý.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VERSION_CONFLICT
            message: Sai trạng thái, phiên bản, key retry hoặc yêu cầu đang được xử lý.
            request_id: REQ-001
            retryable: false
      headers:
        Retry-After:
          description: Số giây chờ, có khi Idempotency-Key cùng payload đang xử lý (retryable=true); trường hợp
            đó trả giá trị 2.
          schema:
            type: integer
            minimum: 1
        X-Correlation-Id:
          description: Mã truy vết receiver tạo/chuẩn hóa.
          schema:
            $ref: '#/components/schemas/Id'
    Unprocessable:
      description: Dữ liệu không đáp ứng điều kiện xử lý; ML có thể thiếu lịch sử.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: Dữ liệu không đáp ứng điều kiện xử lý; ML có thể thiếu lịch sử.
            request_id: REQ-001
            retryable: false
      headers:
        X-Correlation-Id:
          description: Mã truy vết receiver tạo/chuẩn hóa.
          schema:
            $ref: '#/components/schemas/Id'
    RateLimited:
      description: Vượt giới hạn request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RATE_LIMITED
            message: Vượt giới hạn request.
            request_id: REQ-001
            retryable: true
      headers:
        X-Correlation-Id:
          description: Mã truy vết receiver tạo/chuẩn hóa.
          schema:
            $ref: '#/components/schemas/Id'
        Retry-After:
          description: Giây chờ gợi ý; chỉ retry theo retryable và budget.
          schema:
            type: integer
            minimum: 1
    ServerError:
      description: Lỗi xử lý nội bộ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_ERROR
            message: Lỗi xử lý nội bộ.
            request_id: REQ-001
            retryable: false
      headers:
        X-Correlation-Id:
          description: Mã truy vết receiver tạo/chuẩn hóa.
          schema:
            $ref: '#/components/schemas/Id'
    Unavailable:
      description: Dịch vụ phụ thuộc chưa sẵn sàng.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UPSTREAM_UNAVAILABLE
            message: Dịch vụ phụ thuộc chưa sẵn sàng.
            request_id: REQ-001
            retryable: true
      headers:
        X-Correlation-Id:
          description: Mã truy vết receiver tạo/chuẩn hóa.
          schema:
            $ref: '#/components/schemas/Id'
        Retry-After:
          description: Giây chờ gợi ý; chỉ retry theo retryable và budget.
          schema:
            type: integer
            minimum: 1
    Timeout:
      description: Dịch vụ phụ thuộc vượt thời gian chờ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
