    KnowledgeIndexJob:
      type: object
      additionalProperties: false
      required:
        - job_id
        - operation
        - status
        - index_version
        - processed_files
        - indexed_chunks
        - error
        - warnings
        - created_at
        - finished_at
      properties:
        job_id:
          $ref: '#/components/schemas/Id'
        operation:
          type: string
          enum:
            - upsert
            - delete
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        index_version:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 128
        processed_files:
          type: integer
          minimum: 0
          maximum: 50
