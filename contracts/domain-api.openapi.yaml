components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    OrderCreate:
      type: object
      additionalProperties: false
      required:
      - order_code
      - items
      properties:
        order_code: &id002
          type: string
          minLength: 1
          maxLength: 100
        items: &id003
          type: array
          items:
            $ref: ./common.openapi.yaml#/components/schemas/OrderLine
          minItems: 1
          maxItems: 100
      description: Unique order_code; unique SKU per order. No financial/customer PII model in this MVP.
    Order:
      type: object
      additionalProperties: false
      required:
      - id
      - created_at
      - updated_at
      - revision
      - order_code
      - items
      - status
      - created_by
      properties:
        id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
        created_at:
          $ref: ./common.openapi.yaml#/components/schemas/Timestamp
        updated_at:
          $ref: ./common.openapi.yaml#/components/schemas/Timestamp
        revision:
          $ref: ./common.openapi.yaml#/components/schemas/Revision
        order_code: *id002
        items: *id003
        status: *id004
        created_by:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
    OrderEvidenceCommand:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      - reservation_id
      properties:
        expected_revision:
          $ref: ./common.openapi.yaml#/components/schemas/Revision
        reservation_id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
    OrderFulfill:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      - shipment_id
      properties:
        expected_revision:
          $ref: ./common.openapi.yaml#/components/schemas/Revision
        shipment_id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
    OrderCancel:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      - reason
      - reservation_id
      properties:
        expected_revision:
          $ref: ./common.openapi.yaml#/components/schemas/Revision
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        reservation_id:
          anyOf:
          - $ref: ./common.openapi.yaml#/components/schemas/UUID
          - type: 'null'
      description: DRAFT requires null reservation_id. SUBMITTED/CONFIRMED requires scoped workflow service and
        matching RELEASED reservation; then verify any shipment CANCELLED. No direct user cancellation after submission
        in this MVP.
    InventoryItem:
      type: object
      additionalProperties: false
      required:
      - sku
      - on_hand
      - reserved
      - available_quantity
      - updated_at
      properties:
        sku:
          $ref: ./common.openapi.yaml#/components/schemas/Sku
        on_hand:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
        available_quantity:
          type: integer
          minimum: 0
        updated_at:
          $ref: ./common.openapi.yaml#/components/schemas/Timestamp
      description: Invariant available_quantity=on_hand-reserved; a read does not reserve stock.
    ReservationCreate:
      type: object
      additionalProperties: false
      required:
      - order_id
      - order_revision
      - items
      properties:
        order_id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
        order_revision:
          $ref: ./common.openapi.yaml#/components/schemas/Revision
        items:
          type: array
          items:
            $ref: ./common.openapi.yaml#/components/schemas/OrderLine
          minItems: 1
          maxItems: 100
      description: All-or-nothing transaction; verify order/lines via trusted Sales boundary. One reservation per
        order; duplicate order with new key conflicts. Sales order must be SUBMITTED with exact revision/lines;
        do not reserve from a closed or compensating run.
    Reservation:
      type: object
      additionalProperties: false
      required:
      - id
      - created_at
      - updated_at
      - revision
      - order_id
      - items
      - status
      - packed_at
      - handed_over_at
      - shipment_id
      properties:
        id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
        created_at:
          $ref: ./common.openapi.yaml#/components/schemas/Timestamp
        updated_at:
          $ref: ./common.openapi.yaml#/components/schemas/Timestamp
        revision:
          $ref: ./common.openapi.yaml#/components/schemas/Revision
        order_id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
        items:
          type: array
          items:
            $ref: ./common.openapi.yaml#/components/schemas/OrderLine
          minItems: 1
          maxItems: 100
        status:
          type: string
          enum:
          - RESERVED
          - RELEASED
          - CONSUMED
        packed_at:
          anyOf:
          - $ref: ./common.openapi.yaml#/components/schemas/Timestamp
          - type: 'null'
        handed_over_at:
          anyOf:
          - $ref: ./common.openapi.yaml#/components/schemas/Timestamp
          - type: 'null'
        shipment_id:
          anyOf:
          - $ref: ./common.openapi.yaml#/components/schemas/UUID
          - type: 'null'
      allOf:
      - if:
          properties:
            status:
              enum:
              - CONSUMED
        then:
          properties:
            packed_at:
              type: string
            handed_over_at:
              type: string
            shipment_id:
              type: string
      - if:
          properties:
            status:
              enum:
              - RESERVED
              - RELEASED
        then:
          properties:
            handed_over_at:
              type: 'null'
            shipment_id:
              type: 'null'
    Handover:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      - shipment_id
      properties:
        expected_revision:
          $ref: ./common.openapi.yaml#/components/schemas/Revision
        shipment_id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
      description: Requires packed_at; verify CREATED shipment for this reservation. Atomically reserved-=qty and
        on_hand-=qty. Matching Sales order must be CONFIRMED; receiver verifies through trusted API boundary.
    ShipmentCreate:
      type: object
      additionalProperties: false
      required:
      - order_id
      - reservation_id
      properties:
        order_id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
        reservation_id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
      description: Current workflow executor only; matching Sales CONFIRMED and packed RESERVED reservation required.
        One shipment per reservation. Creation timeout must be reconciled before terminal cancellation.
    Shipment:
      type: object
      additionalProperties: false
      required:
      - id
      - created_at
      - updated_at
      - revision
      - order_id
      - reservation_id
      - status
      - picked_up_at
      - delivered_at
      properties:
        id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
        created_at:
          $ref: ./common.openapi.yaml#/components/schemas/Timestamp
        updated_at:
          $ref: ./common.openapi.yaml#/components/schemas/Timestamp
        revision:
          $ref: ./common.openapi.yaml#/components/schemas/Revision
        order_id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
        reservation_id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
        status:
          type: string
          enum:
          - CREATED
          - IN_TRANSIT
          - DELIVERED
          - CANCELLED
        picked_up_at:
          anyOf:
          - $ref: ./common.openapi.yaml#/components/schemas/Timestamp
          - type: 'null'
        delivered_at:
          anyOf:
          - $ref: ./common.openapi.yaml#/components/schemas/Timestamp
          - type: 'null'
      allOf:
      - if:
          properties:
            status:
              enum:
              - CREATED
              - CANCELLED
        then:
          properties:
            picked_up_at:
              type: 'null'
            delivered_at:
              type: 'null'
      - if:
          properties:
            status:
              enum:
              - IN_TRANSIT
        then:
          properties:
            picked_up_at:
              type: string
            delivered_at:
              type: 'null'
      - if:
          properties:
            status:
              enum:
              - DELIVERED
        then:
          properties:
            picked_up_at:
              type: string
            delivered_at:
              type: string
    OrderPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
          minItems: 0
          maxItems: 100
        next_cursor:
          $ref: ./common.openapi.yaml#/components/schemas/PageCursor
    InventoryItemPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItem'
          minItems: 0
          maxItems: 100
        next_cursor:
          $ref: ./common.openapi.yaml#/components/schemas/PageCursor
    ReservationPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Reservation'
          minItems: 0
          maxItems: 100
        next_cursor:
          $ref: ./common.openapi.yaml#/components/schemas/PageCursor
    ShipmentPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Shipment'
          minItems: 0
          maxItems: 100
        next_cursor:
          $ref: ./common.openapi.yaml#/components/schemas/PageCursor
