paths:
  "/api/v1/core/data-products":
    post:
      operationId: "createProduct"
      summary: "Create a draft Data Product"
      description: "One source/schema/object is one product. No DDL and no automatic read permission."
      tags: ["DataGovernance"]
      x-priority: "P0"
      x-authorization-policy: "IT_ADMIN"
      x-authorization: >-
        ACTIVE trusted principal with platform_role=PLATFORM_ADMIN (IT). Full DX-OS control-plane authority
        across departments: registration, configuration, publish, grant/revoke and audit. No department
        OWNER membership or separate department approval required. Technical validation, resource state,
        revision and verification guards still apply; this role does not bypass normal data grants or
        Business API authorization.
      x-database-alignment: "PENDING_DB_ALIGNMENT"
      x-idempotency: "DURABLE_COMMAND"
      parameters:
        - {"$ref":"./common.openapi.yaml#/components/parameters/CorrelationId"}
        - {"$ref":"./common.openapi.yaml#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content: {"application/json":{"schema":{"$ref":"./data-governance.yaml#/components/schemas/ProductCreate"}}}
      responses:
        "201":
          description: "Validated JSON response."
          headers:
            X-Correlation-Id: {"$ref":"./common.openapi.yaml#/components/headers/CorrelationId"}
            Idempotency-Replayed: {"$ref":"./common.openapi.yaml#/components/headers/IdempotencyReplayed"}
            Cache-Control: {"$ref":"./common.openapi.yaml#/components/headers/CacheControl"}
          content: {"application/json":{"schema":{"$ref":"./data-governance.yaml#/components/schemas/Product"}}}
        "400": {"$ref":"./common.openapi.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.openapi.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.openapi.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.openapi.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.openapi.yaml#/components/responses/Error409"}
        "422": {"$ref":"./common.openapi.yaml#/components/responses/Error422"}
        "429": {"$ref":"./common.openapi.yaml#/components/responses/Error429"}
        "500": {"$ref":"./common.openapi.yaml#/components/responses/Error500"}
        "503": {"$ref":"./common.openapi.yaml#/components/responses/Error503"}
        "504": {"$ref":"./common.openapi.yaml#/components/responses/Error504"}
    get:
      operationId: "listProducts"
      summary: "Discover the organization catalog"
      description: >-
        Catalog metadata is organization-visible, including classification labels; this is not permission to
        read rows. Cursor bound to filters/caller; created_at,id ascending.
      tags: ["DataGovernance"]
      x-priority: "P0"
      x-authorization-policy: "CATALOG_READ"
      x-authorization: >-
        PLATFORM_ADMIN may inspect all registry metadata. Other ACTIVE organization principals may inspect
        only visible ACTIVE products/current PUBLISHED contracts with CONNECTED sources and active
        affiliated applications/departments. Catalog visibility grants no row access or management
        authority.
      x-database-alignment: "PENDING_DB_ALIGNMENT"
      x-idempotency: "NONE_READ_ONLY"
      parameters:
        - {"$ref":"./common.openapi.yaml#/components/parameters/CorrelationId"}
        - {"$ref":"./common.openapi.yaml#/components/parameters/Limit"}
        - {"$ref":"./common.openapi.yaml#/components/parameters/Cursor"}
        -
          name: "application_id"
          in: "query"
          required: false
          schema: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
      responses:
        "200":
          description: "Validated JSON response."
          headers:
            X-Correlation-Id: {"$ref":"./common.openapi.yaml#/components/headers/CorrelationId"}
            Cache-Control: {"$ref":"./common.openapi.yaml#/components/headers/CacheControl"}
          content: {"application/json":{"schema":{"$ref":"./data-governance.yaml#/components/schemas/ProductPage"}}}
        "400": {"$ref":"./common.openapi.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.openapi.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.openapi.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.openapi.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.openapi.yaml#/components/responses/Error409"}
        "422": {"$ref":"./common.openapi.yaml#/components/responses/Error422"}
        "429": {"$ref":"./common.openapi.yaml#/components/responses/Error429"}
        "500": {"$ref":"./common.openapi.yaml#/components/responses/Error500"}
        "503": {"$ref":"./common.openapi.yaml#/components/responses/Error503"}
        "504": {"$ref":"./common.openapi.yaml#/components/responses/Error504"}
      x-pagination: {"sort":["created_at","id"],"direction":"asc","cursor_bound_to_filters":true}
