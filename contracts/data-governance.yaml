      additionalProperties: false
      required: ["expected_revision","scope_json","expires_at"]
      properties:
        expected_revision: {"$ref":"./common.openapi.yaml#/components/schemas/Revision"}
        scope_json: {"$ref":"./common.openapi.yaml#/components/schemas/DataScope"}
        expires_at: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"},{"type":"null"}]}
        decision_note: {"anyOf":[{"type":"string","minLength":1,"maxLength":2000},{"type":"null"}]}
    DecideRequest:
      type: "object"
      additionalProperties: false
      required: ["expected_revision","decision_note"]
      properties:
