      type: "object"
      additionalProperties: false
      required: ["expected_desired_revision","reason"]
      properties:
        expected_desired_revision: {"$ref":"./common.openapi.yaml#/components/schemas/Revision"}
        reason: {"type":"string","minLength":1,"maxLength":1000}
    PublicationJob:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "job_type"
        - "data_source_id"
        - "data_product_id"
        - "access_grant_id"
        - "target_revision"
        - "status"
        - "attempt_count"
        - "max_attempts"
        - "next_attempt_at"
        - "last_error_code"
        - "created_at"
        - "updated_at"
      properties:
        id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        job_type: {"type":"string","enum":["CONNECT_SOURCE","PUBLISH_PRODUCT","APPLY_GRANT","REVOKE_GRANT","DISABLE_PRODUCT","PUBLISH_RELATIONSHIP","DISABLE_RELATIONSHIP"]}
        relationship_id: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        data_source_id: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        data_product_id: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        access_grant_id: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        target_revision: {"$ref":"./common.openapi.yaml#/components/schemas/Revision"}
        status: {"type":"string","enum":["QUEUED","RUNNING","RETRY","SUCCEEDED","FAILED"]}
        attempt_count: {"type":"integer","minimum":0}
        max_attempts: {"type":"integer","minimum":1}
        next_attempt_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
        last_error_code: {"anyOf":[{"type":"string","minLength":1,"maxLength":100},{"type":"null"}]}
        created_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
        updated_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
      allOf:
        -
          if: {"properties":{"job_type":{"const":"CONNECT_SOURCE"}}}
          then:
            properties:
              data_source_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
              data_product_id: {"type":"null"}
              access_grant_id: {"type":"null"}
        -
          if: {"properties":{"job_type":{"enum":["PUBLISH_PRODUCT","DISABLE_PRODUCT"]}}}
          then:
            properties:
              data_source_id: {"type":"null"}
              data_product_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
              access_grant_id: {"type":"null"}
        -
          if: {"properties":{"job_type":{"enum":["APPLY_GRANT","REVOKE_GRANT"]}}}
          then:
            properties:
              data_source_id: {"type":"null"}
              data_product_id: {"type":"null"}
              access_grant_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
      description: >-
        Read-only redacted job projection. Lease/worker/secret state is internal. SUCCEEDED requires target
        revision CAS and enforcement verification; superseded jobs fail with STALE_REVISION.
