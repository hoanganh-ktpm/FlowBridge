        reason: {"type":"string","minLength":1,"maxLength":2000}
        requested_by: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        requested_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
        status: {"type":"string","enum":["PENDING","APPROVED","REJECTED","CANCELLED"]}
        decision_note: {"anyOf":[{"type":"string","minLength":1,"maxLength":2000},{"type":"null"}]}
        decided_by: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        decided_at: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"},{"type":"null"}]}
    ApproveRequest:
