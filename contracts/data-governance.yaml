        revoked_at: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"},{"type":"null"}]}
        updated_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
      description: >-
