        contract_version_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        grant_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        desired_revision: {"$ref":"./common.openapi.yaml#/components/schemas/Revision"}
        applied_revision: {"$ref":"./common.openapi.yaml#/components/schemas/Revision"}
        enforcement_role: {"type":"string","pattern":"^dxos_department_[a-f0-9]{32}$"}
        validated_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
        expires_at: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"},{"type":"null"}]}
      readOnly: true
      description: >-
        INTERNAL trusted policy result, never client input or HTTP read response. Resolver verifies current
