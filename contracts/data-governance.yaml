        objects:
          type: "array"
          items: {"$ref":"./data-governance.yaml#/components/schemas/DiscoveredObject"}
          minItems: 0
          maxItems: 1000
      description: >-
        Live bounded read-only discovery; no business rows. Caller/IT-approved schema/object scope required.
        Truncation or timeout returns an error, never an apparently complete partial snapshot.
