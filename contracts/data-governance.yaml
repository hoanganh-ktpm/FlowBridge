        target_object: {"$ref":"./common.openapi.yaml#/components/schemas/Identifier"}
        target_columns:
          type: "array"
          items: {"$ref":"./common.openapi.yaml#/components/schemas/Identifier"}
          minItems: 1
          maxItems: 20
    DiscoveredObject:
      type: "object"
      additionalProperties: false
      required: ["schema_name","object_name","object_type","columns","primary_key","unique_constraints","foreign_keys"]
      properties:
        schema_name: {"$ref":"./common.openapi.yaml#/components/schemas/Identifier"}
        object_name: {"$ref":"./common.openapi.yaml#/components/schemas/Identifier"}
        object_type: {"type":"string","enum":["TABLE","VIEW"]}
        columns:
          type: "array"
          items: {"$ref":"./data-governance.yaml#/components/schemas/DiscoveredColumn"}
          minItems: 1
          maxItems: 1000
        primary_key:
          type: "array"
          items: {"$ref":"./common.openapi.yaml#/components/schemas/Identifier"}
          minItems: 0
          maxItems: 20
        unique_constraints:
          type: "array"
          items:
            type: "array"
            items: {"$ref":"./common.openapi.yaml#/components/schemas/Identifier"}
            minItems: 1
            maxItems: 20
          minItems: 0
          maxItems: 100
        foreign_keys:
          type: "array"
          items: {"$ref":"./data-governance.yaml#/components/schemas/DiscoveredForeignKey"}
          minItems: 0
          maxItems: 100
      description: >-
        Confirmed physical metadata only. Equal names never imply FK. Missing view keys are empty, not
        inferred uniqueness. Partial unique indexes do not prove whole-object uniqueness.
    SourceSchema:
      type: "object"
      additionalProperties: false
      required: ["data_source_id","captured_at","schema_hash","objects"]
      properties:
        data_source_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
