  "/api/v1/core/data-products/{data_product_id}/rows":
    parameters:
      -
        name: "data_product_id"
        in: "path"
        required: true
        schema: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
    get:
      operationId: "readDataProductRows"
      summary: "Read a governed live Data Product projection"
      description: >-
        Public column names, including all public business_key fields, are required (missing keys:422,
        insufficient grant:403). Query only approved metadata through Hasura v2 CE with trusted non-admin
        identity. Recheck policy every request; never SQL/GraphQL/role input. Use verified
        public-to-physical mapping, deterministic business-key order and limit+1 for has_more without
        leaking extra data. Reject partial/errors/invalid rows (503). Source updates committed before a new
        query are visible subject to DB isolation; no copying, caching, snapshot/export guarantee. P0
        bigint/numeric must be JSON-safe exact values or exposed as text by an approved view, otherwise
        publication/read fails; no rounding.
      tags: ["DataGovernance"]
      x-priority: "P0"
      x-authorization-policy: "DATA_GRANT"
      x-authorization: >-
        Every caller, including IT when using the normal data endpoint, needs an ACTIVE principal and
        effective bindings; ACTIVE product/current PUBLISHED contract; CONNECTED source; active affiliated
        applications/departments; one ACTIVE unexpired department grant with
        applied_revision=desired_revision covering every requested physical column. PLATFORM_ADMIN and
        legacy OWNER membership alone are not a row-read grant; Core checks current policy and Hasura
        enforces columns.
      x-database-alignment: "PENDING_DB_ALIGNMENT"
      x-idempotency: "NONE_READ_ONLY"
      parameters:
        - {"$ref":"./common.openapi.yaml#/components/parameters/CorrelationId"}
        -
          name: "contract_version_id"
          in: "query"
          required: true
          schema: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        -
          name: "columns"
          in: "query"
          required: true
          schema:
            type: "array"
            items: {"$ref":"./common.openapi.yaml#/components/schemas/Identifier"}
            minItems: 1
            maxItems: 100
            uniqueItems: true
          style: "form"
          explode: false
        -
          name: "limit"
          in: "query"
          required: false
          schema: {"type":"integer","minimum":1,"maximum":100,"default":20}
        -
          name: "offset"
          in: "query"
          required: false
          schema: {"type":"integer","minimum":0,"maximum":10000,"default":0}
      responses:
        "200":
          description: "Validated JSON response."
          headers:
            X-Correlation-Id: {"$ref":"./common.openapi.yaml#/components/headers/CorrelationId"}
            Cache-Control: {"$ref":"./common.openapi.yaml#/components/headers/CacheControl"}
