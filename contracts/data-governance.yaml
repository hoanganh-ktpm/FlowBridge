        object_name: {"$ref":"./common.openapi.yaml#/components/schemas/Identifier"}
        object_type: {"type":"string","enum":["TABLE","VIEW"]}
        classification: {"$ref":"./common.openapi.yaml#/components/schemas/Classification"}
    Product:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "created_at"
        - "updated_at"
        - "created_by"
        - "updated_by"
        - "revision"
        - "data_source_id"
        - "product_key"
        - "name"
        - "description"
        - "schema_name"
        - "object_name"
        - "object_type"
        - "classification"
        - "owner_department_id"
        - "active_contract_id"
        - "status"
      properties:
        id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        created_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
        updated_at: {"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"}
        created_by: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        updated_by: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        revision: {"$ref":"./common.openapi.yaml#/components/schemas/Revision"}
        data_source_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        product_key: {"$ref":"./common.openapi.yaml#/components/schemas/QualifiedKey"}
        name: {"type":"string","minLength":1,"maxLength":200}
        description: {"anyOf":[{"type":"string","minLength":1,"maxLength":2000},{"type":"null"}]}
        schema_name: {"$ref":"./common.openapi.yaml#/components/schemas/Identifier"}
        object_name: {"$ref":"./common.openapi.yaml#/components/schemas/Identifier"}
        object_type: {"type":"string","enum":["TABLE","VIEW"]}
        classification: {"$ref":"./common.openapi.yaml#/components/schemas/Classification"}
        owner_department_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        active_contract_id: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        status: {"type":"string","enum":["DRAFT","READY","PROVISIONING","ACTIVE","ERROR","DISABLED"]}
