        contract_version_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        access_request_id: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/UUID"},{"type":"null"}]}
        consumer_department_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        consumer_principal_id: {"type":"null"}
        scope_json: {"$ref":"./common.openapi.yaml#/components/schemas/DataScope"}
        desired_revision: {"$ref":"./common.openapi.yaml#/components/schemas/Revision"}
        applied_revision: {"type":"integer","minimum":0}
        status: {"type":"string","enum":["PENDING_APPLY","ACTIVE","REVOKING","REVOKED","EXPIRED","ERROR"]}
        expires_at: {"anyOf":[{"$ref":"./common.openapi.yaml#/components/schemas/Timestamp"},{"type":"null"}]}
