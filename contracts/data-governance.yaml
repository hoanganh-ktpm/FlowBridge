    parameters:
      -
        name: "data_source_id"
        in: "path"
        required: true
        schema: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
    get:
      operationId: "discoverSourceSchema"
      summary: "discoverSourceSchema"
      description: >-
        CONNECTED source required. Requested scope must be within the IT source allowlist; no scope means
        the configured bounded default, never unrestricted discovery. Maximum 1000 objects/1000 columns
        each, bounded timeout and response size. No SQL or business rows.
      tags: ["DataGovernance"]
      x-priority: "P0"
      x-authorization-policy: "IT_ADMIN"
      x-authorization: >-
        ACTIVE trusted principal with platform_role=PLATFORM_ADMIN (IT). Full DX-OS control-plane authority
