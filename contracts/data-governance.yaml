        consumer_department_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        consumer_principal_id: {"type":"null"}
        requested_scope_json: {"$ref":"./common.openapi.yaml#/components/schemas/DataScope"}
