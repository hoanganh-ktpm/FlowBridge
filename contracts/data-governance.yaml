        -
          name: "schema_name"
          in: "query"
          required: false
          schema: {"$ref":"./common.openapi.yaml#/components/schemas/Identifier"}
        -
          name: "object_names"
          in: "query"
          required: false
          schema:
            type: "array"
            items: {"$ref":"./common.openapi.yaml#/components/schemas/Identifier"}
            minItems: 1
            maxItems: 100
            uniqueItems: true
          style: "form"
          explode: false
      responses:
        "200":
          description: "Validated JSON response."
          headers:
            X-Correlation-Id: {"$ref":"./common.openapi.yaml#/components/headers/CorrelationId"}
            Cache-Control: {"$ref":"./common.openapi.yaml#/components/headers/CacheControl"}
