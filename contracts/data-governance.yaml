        current effective policy. enforcement_role remains internal.
    ApproveAccepted:
      type: "object"
      additionalProperties: false
      required: ["access_request","grant","job"]
      properties:
        access_request: {"$ref":"./data-governance.yaml#/components/schemas/AccessRequest"}
        grant: {"$ref":"./data-governance.yaml#/components/schemas/Grant"}
        job: {"$ref":"./common.openapi.yaml#/components/schemas/AsyncJobAccepted"}
