        error_code: {"anyOf":[{"type":"string","minLength":1,"maxLength":100},{"type":"null"}]}
        summary: {"type":"string","minLength":1,"maxLength":1000}
      description: >-
        Policy-visible append-only projection, not raw diff_json. Never business rows, source coordinates,
        secret refs, bearer tokens or unsanitized exception bodies.
    DataRows:
      type: "object"
      additionalProperties: false
      required: ["data_product_id","contract_version_id","columns","rows","limit","offset","has_more"]
      properties:
        data_product_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        contract_version_id: {"$ref":"./common.openapi.yaml#/components/schemas/UUID"}
        columns:
          type: "array"
          items: {"$ref":"./common.openapi.yaml#/components/schemas/Identifier"}
          minItems: 1
          maxItems: 100
          uniqueItems: true
        rows:
          type: "array"
          items:
            type: "object"
            minProperties: 1
            maxProperties: 100
            additionalProperties: {"type":["string","number","boolean","null"]}
          minItems: 0
          maxItems: 100
        limit: {"type":"integer","minimum":1,"maximum":100}
        offset: {"type":"integer","minimum":0,"maximum":10000}
        has_more: {"type":"boolean"}
      description: >-
        P0 scalar wire profile. columns and row keys use PUBLIC names; access-grant columns use PHYSICAL
        names and are resolved through the pinned contract. Exact row shape, types/nullability/constraints
        and precision are checked dynamically. Reject the entire response on upstream errors or any invalid
        row.
