        '504':
          $ref: ./common.openapi.yaml#/components/responses/Error504
components:
  schemas:
    RelationshipDefinition:
      type: object
      additionalProperties: false
      required:
      - name
      - source_product_id
      - target_product_id
      - relationship_type
      - field_mapping
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^(?!__)[a-z_][a-z0-9_]*$
        source_product_id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
        target_product_id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
        relationship_type:
          enum:
          - object
          - array
        field_mapping:
          type: object
          minProperties: 1
          maxProperties: 20
          propertyNames:
            type: string
            minLength: 1
            maxLength: 63
            pattern: ^(?!__)[a-z_][a-z0-9_]*$
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 63
            pattern: ^(?!__)[a-z_][a-z0-9_]*$
    ProductRelationship:
      type: object
      additionalProperties: false
      required:
      - name
      - source_product_id
      - target_product_id
      - relationship_type
      - field_mapping
      - id
      - source_contract_id
      - target_contract_id
      - status
      - revision
      - applied_revision
      - last_error_code
      - created_at
      - updated_at
      - created_by
      - updated_by
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^(?!__)[a-z_][a-z0-9_]*$
        source_product_id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
        target_product_id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
        relationship_type:
          enum:
          - object
          - array
        field_mapping:
          type: object
          minProperties: 1
          maxProperties: 20
          propertyNames:
            type: string
            minLength: 1
            maxLength: 63
            pattern: ^(?!__)[a-z_][a-z0-9_]*$
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 63
            pattern: ^(?!__)[a-z_][a-z0-9_]*$
        id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
        source_contract_id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
        target_contract_id:
          $ref: ./common.openapi.yaml#/components/schemas/UUID
        status:
          enum:
          - DRAFT
          - PROVISIONING
          - ACTIVE
          - DISABLING
          - DISABLED
          - ERROR
        revision:
          $ref: ./common.openapi.yaml#/components/schemas/Revision
        applied_revision:
          type: integer
          minimum: 0
        last_error_code:
          type:
          - string
          - 'null'
        created_at:
          $ref: ./common.openapi.yaml#/components/schemas/Timestamp
        updated_at:
          $ref: ./common.openapi.yaml#/components/schemas/Timestamp
        created_by:
          anyOf:
          - $ref: ./common.openapi.yaml#/components/schemas/UUID
          - type: 'null'
        updated_by:
          anyOf:
          - $ref: ./common.openapi.yaml#/components/schemas/UUID
          - type: 'null'
    RelationshipQuerySelection:
      type: object
      additionalProperties: false
      $dynamicAnchor: selection
      required:
      - select
      properties:
        select:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 63
            pattern: ^(?!__)[a-z_][a-z0-9_]*$
        contract_version_id:
          anyOf:
          - $ref: ./common.openapi.yaml#/components/schemas/UUID
          - type: 'null'
        where:
          type: object
          maxProperties: 50
          propertyNames:
            type: string
            minLength: 1
            maxLength: 63
            pattern: ^(?!__)[a-z_][a-z0-9_]*$
          additionalProperties:
            type: object
            minProperties: 1
            additionalProperties: false
            properties:
              _eq:
                type:
                - string
                - number
                - boolean
              _neq:
                type:
                - string
                - number
                - boolean
              _gt:
                type:
                - string
                - number
              _gte:
                type:
                - string
                - number
              _lt:
                type:
                - string
                - number
              _lte:
                type:
                - string
                - number
              _is_null:
                type: boolean
              _in:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type:
                  - string
                  - number
                  - boolean
        order_by:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required:
            - field
            properties:
              field:
                type: string
                minLength: 1
                maxLength: 63
                pattern: ^(?!__)[a-z_][a-z0-9_]*$
              direction:
                enum:
                - asc
                - desc
                default: asc
        include:
          type: object
          maxProperties: 20
          propertyNames:
            type: string
            minLength: 1
            maxLength: 63
            pattern: ^(?!__)[a-z_][a-z0-9_]*$
          additionalProperties:
            $dynamicRef: '#selection'
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        offset:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      description: Bounded selection tree; max depth 4, array rows 20, complexity 10000 by default. Scalar-only
        predicates/order. Object relationships accept select/include/contract pin only. All referenced,
        key, filter and ordering columns require grants in one common department. No aggregate, SQL or
        relation predicates.
