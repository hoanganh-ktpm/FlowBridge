    IngestionResult:
      type: object
      additionalProperties: false
      description: >-
        Một lô commit nguyên tử: received=accepted, rejected=0. Kết quả chỉ được ghi khi toàn lô và
        lineage/outbox đã commit. committed_at là thời điểm commit, observed_at là thời điểm của nguồn.
      properties:
        collection:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        schema_version:
          $ref: '#/components/schemas/CollectionSchemaVersion'
        source_kind:
          type: string
          enum:
          - IT
          - OT
        source_id:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        received:
          type: integer
          minimum: 1
          maximum: 1000
        accepted:
          type: integer
          minimum: 1
          maximum: 1000
        rejected:
          const: 0
        lineage_id:
          $ref: '#/components/schemas/Id'
        committed_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - collection
      - schema_version
      - source_kind
      - source_id
      - observed_at
      - received
      - accepted
      - rejected
      - lineage_id
      - committed_at
x-olp2026:
  source: https://www.vfossa.vn/tin-tuc/de-thi-phan-mem-nguon-mo-olp-2026-798.html
  required_core_capabilities:
  - Identity/SSO
  - API Gateway
  - Structured Data
  - Unstructured Data
  - Workflow
  architecture: Core chạy headless và phục vụ ứng dụng H-P-D-I; Supplier Assistant minh họa không gian I ở tầng ứng dụng.
  traceability:
    identity_sso:
    - /api/v1/core/identity/config
    - /api/v1/core/identity/me
    api_gateway: >-
      Routing, xác thực biên, giới hạn lưu lượng và CORS là cấu hình Gateway, không phải một UI hoặc API mua
      hàng.
    structured_data:
    - /api/v1/core/data/{collection}
    - /internal/v1/core/data/transactions
    - row-level policy
    - /api/v1/core/data/{collection}/{record_id}/history
    unstructured_data:
    - /api/v1/core/files
    - quarantine/scan_status
    - download khi clean
    - /api/v1/core/files/search
    workflow:
    - /internal/v1/core/workflow/definitions
    - /internal/v1/core/workflow/instances
    - /api/v1/core/workflow/tasks
  technical_principles:
    data_lifecycle: >-
      OLTP + outbox/revision cùng transaction; worker CDC/archive lưu lịch sử vào kho phân tích. API history
      phục vụ revision theo ACL hiện tại. Archive không nằm trên critical path; offset, retention, checksum và
      restore theo phụ lục.
    it_ot: >-
      Adapter IT/OT chuẩn hóa source_id, observed_at và CollectionSchemaVersion, chia lô tối đa 1000 bản ghi,
      dùng ingestion-jobs. Luồng realtime dùng broker/adapter và idempotency; việc hỗ trợ NGSI-LD cần binding
      riêng được khai báo, không suy ra từ source_kind.
    data_governance: >-
      Registry giữ schema phiên bản; ingestion all-or-nothing, IngestionResult có lineage_id và thống kê.
      Lineage liên kết source/job/record revisions/report; chính sách chất lượng và quyền lịch sử bắt buộc
      theo phụ lục.
    zero_trust_gitops: >-
      Gateway và từng dịch vụ xác minh loại token, audience/tenant/scope và resource binding; scanner
      fail-closed; secrets nằm ngoài Git. GitOps reconcile, health check, backup/restore và diễn tập sự cố có
      tiêu chí nghiệm thu trong phụ lục.
  delivery_requirements:
  - Chọn công nghệ nguồn mở và kiểm tra giấy phép phụ thuộc.
  - Công bố kho mã nguồn và cấu hình triển khai theo thể lệ.
  - Demo UI sử dụng năng lực nền tảng thay vì làm lại lõi trong ứng dụng.
x-gateway-routing:
  public: /api/v1/core/* → dịch vụ lõi tương ứng; /api/v1/* của ứng dụng → Supplier Assistant.
  internal: Data Lookup Tool dùng CORE_DATA_URL đến Data API nội bộ; không gọi vòng qua public Gateway.
  configuration:
  - TLS
  - OIDC/JWT verification
  - CORS cho các origin Web được cấu hình
  - rate limits
  - correlation ID
  - dịch vụ nội bộ không mở công khai
x-write-policies: Các collection nghiệp vụ như purchase_requests/proposals/purchase_orders/risk_assessments/outbox
  chỉ cho dịch vụ có scope phù hợp ghi. Web/App đọc theo policy; thao tác tạo/phê duyệt dùng app-api.yaml để không
  vượt quy tắc nghiệp vụ.
x-schema-policy: File tự chứa đầy đủ schema/parameters/responses để mở độc lập trong Swagger Editor. Các schema
  chia sẻ được đồng bộ từ định nghĩa gốc của opencore-api.yaml/app-api.yaml/ai-tools-api.yaml; khi thay đổi phải
  cập nhật nơi sử dụng.
x-authorization-policy:
  enforcement: >-
    Các extension quyền là yêu cầu chuẩn tắc của hợp đồng. Middleware/policy adapter phải triển khai và kiểm
    thử; OpenAPI tooling không tự thực thi chúng.
  token_classes:
    BearerAuth: >-
      Chỉ token người dùng được IAM xác minh; không chấp nhận token dịch vụ bằng cách rơi qua nhánh
      BearerAuth.
    ServiceAuth: >-
      Chỉ token dịch vụ xác minh từ IAM; tenant/application/scope lấy từ token và registry client tin cậy,
      không từ JSON/prompt.
  extension_rules:
    x-required-service-scope: Bắt buộc khi chọn nhánh ServiceAuth; không áp scope dịch vụ cho caller BearerAuth.
    x-required-user-scope: Bắt buộc khi caller BearerAuth.
    x-required-roles: Kết hợp AND với scope; x-required-roles-mode=any nghĩa ít nhất một role.
    x-service-resource-policy: Bắt buộc với service theo registry policy; scope hợp lệ không tự cấp quyền mọi tài nguyên.
  forwarded_user_context: >-
    Nếu X-User-Context xuất hiện ở bất kỳ nhánh dịch vụ nào, bắt buộc xác minh
    signature/issuer/audience/expiry/tenant và giao quyền dịch vụ với quyền người dùng. Không được bỏ qua
    header sai hoặc chọn nhánh service-only để tăng quyền.
  file_application_binding:
    checks:
    - Đúng tenant và ứng dụng được registry client cho phép.
    - >-
      Upload dịch vụ: metadata chứa binding tài nguyên hoặc dataset; kiểm tra bản ghi nguồn/điều kiện workflow
      hoặc dataset qua nguồn tin cậy.
    - >-
      List/read/download/search dịch vụ: lọc theo ACL/resource/dataset và app binding lưu phía server; kiểm
      tra lại trước tải và trích excerpt.
    - >-
      Mọi lượt download/search/RAG chỉ sử dụng clean; scanner failed/pending/rejected không được vượt bằng
      token admin/dịch vụ.
    untrusted_metadata: >-
      metadata chỉ là selector; owner/ACL/tenant và liên kết được server xác minh, không sao chép thành quyền
      từ metadata.
  workflow_application_binding:
    checks:
    - Đúng tenant/application và binding instance/task với tài nguyên được service principal cho phép.
    - workflow:read không cấp workflow:act-on-behalf.
    - Worker nền dựa vào policy/bản ghi nguồn đã xác minh, không giữ token người dùng để sử dụng vô hạn.
  error_handling: >-
    Thiếu/sai token 401; thiếu scope/role 403; truy cập ngoài tenant hoặc tài nguyên cần che tồn tại trả 404
    theo policy thống nhất; không trả dữ liệu trước khi áp policy.
x-idempotency-policy:
  minimum_retention_seconds: 86400
  scope:
  - verified_principal_id
  - tenant_id
  - method
  - canonical_path
  - Idempotency-Key
  json: >-
    Hash JSON canonical: thứ tự key không ảnh hưởng; bảo toàn kiểu, thứ tự mảng và nội dung chuỗi. Không chuẩn
    hóa mất thông tin nghiệp vụ.
  multipart: >-
    Hash nội dung file theo SHA-256, tên file, content-type và metadata JSON canonical; bỏ qua multipart
    boundary/thứ tự part. Từ chối part trùng tên hoặc metadata JSON lỗi.
  in_flight:
    status: 409
    code: IDEMPOTENCY_CONFLICT
    retryable: true
    retry_after_seconds: 2
    effect: Chỉ request đã claim key mới được thực thi. Lỗi đang xử lý không ghi đè kết quả thành công về sau.
  different_payload:
    status: 409
    code: IDEMPOTENCY_CONFLICT
    retryable: false
  long_running: >-
    Không expire key trước khi request/job liên quan kết thúc; sau kết thúc giữ tối thiểu thời hạn công bố.
    Timeout/5xx không đủ để tự chạy tác dụng phụ lần hai; phải đối soát durable outcome.
  durable_uniqueness: >-
    Sau TTL, các khóa duy nhất nghiệp vụ như workflow binding, event_id và revision/version vẫn bảo vệ replay.
    API không hứa chống trùng vô hạn chỉ bằng Idempotency-Key.
x-workflow-consistency:
  local_atomicity: >-
    Workflow adapter lưu task/instance + audit + outbox của nó trong một local transaction. Core Data
    transaction lưu bản ghi + revision + outbox của nó trong một local transaction.
  cross_engine: >-
    Nếu hai engine không dùng chung local transaction, sử dụng durable outbox/inbox và saga, không giả định
    distributed ACID. Không phát sự kiện phê duyệt trước khi quyết định được engine authoritative commit.
  reconciliation: >-
    Consumer chống trùng theo event_id và kiểm tra aggregate_version; lỗi đồng bộ lưu retry/failed state và
    tác vụ đối soát. Dữ liệu projection phải ghi workflow version cuối đã đồng bộ.
  effect_guard: >-
    Trước tác dụng phụ không đảo ngược, worker phải đọc trạng thái authoritative, kiểm tra binding/version và
    khóa duy nhất của nghiệp vụ. Projection stale không đủ cấp quyền phát hành/gửi.
  recovery: Khôi phục từ inbox/outbox/offset đã lưu; retry không tạo thêm quyết định, instance hoặc tác dụng phụ.
x-platform-bindings:
  document: ../tai-lieu/Van-hanh-OpenCore-v0.2.0.md
  status: >-
    Yêu cầu và giao diện tích hợp đã đặc tả; công nghệ cụ thể/cấu hình và bằng chứng runtime phải được điền
    khi triển khai. Không coi tài liệu này là xác nhận đã vận hành.
  bindings:
  - id: identity
    owner: IAM adapter
    interfaces:
    - /api/v1/core/identity/config
    - /api/v1/core/identity/me
    acceptance: PKCE, MFA policy, issuer/audience/expiry, token class và secrets theo phụ lục.
  - id: gateway
    owner: Gateway + policy adapter
    interfaces:
    - x-gateway-routing
    - x-authorization-policy
    acceptance: Chặn external /internal/*; scope/tenant/resource checks tại receiver; rate-limit và correlation.
  - id: structured-data
    owner: Data adapter + OLTP store
    interfaces:
    - /internal/v1/core/data/transactions
    - /api/v1/core/data/{collection}/{record_id}/history
    acceptance: Rollback ghi dữ liệu/revision/outbox; history theo ACL hiện tại; archive worker không chặn OLTP.
  - id: files-and-search
    owner: Object store adapter + scanner + full-text indexer
    interfaces:
    - /api/v1/core/files
    - /api/v1/core/files/{file_id}/download
    - /api/v1/core/files/search
    acceptance: Tách quarantine/clean, fail-closed; không leak ACL qua excerpt/total, hỗ trợ PO worker và index service.
  - id: workflow
    owner: BPMN adapter + automation worker
    interfaces:
    - /internal/v1/core/workflow/definitions
    - /internal/v1/core/workflow/instances
    - /internal/v1/core/workflow/tasks/{task_id}/actions
    - x-workflow-consistency
    acceptance: Guard/version và nguồn phê duyệt authoritative; đối soát được khi engine khác nhau.
  - id: it-ot-lineage
    owner: IT/OT adapter + ingestion worker + lineage store
    interfaces:
    - /internal/v1/core/ingestion-jobs
    - /internal/v1/core/ingestion-jobs/{job_id}
    acceptance: >-
      Đúng schema_version; thống kê nguyên tử; source/job/revision/report truy ngược được; realtime adapter có
      mapping riêng.
  - id: events-and-communications
    owner: Outbox dispatcher + broker + notification adapter
    interfaces:
    - /internal/v1/core/events
    - /api/v1/core/notifications
    acceptance: >-
      ACK chỉ sau ghi bền vững, inbox dedup, retry/DLQ/offset; websocket/subscription nếu dùng phải có policy
      riêng.
  - id: operations
    owner: GitOps runner + secrets/backup/monitoring adapters
    interfaces:
    - /api/v1/core/audit-entries
    - x-gateway-routing
    acceptance: Manifest và secrets tách biệt, reconcile được drift, phục hồi được backup, audit chống sửa theo phụ lục.
x-contract-migration:
  from: 0.1.0
  to: 0.2.0
  breaking_changes:
  - IngestionRequest.schema_version chuyển string sang CollectionSchemaVersion integer >=1.
  - Filter kiểm tra kiểu value theo op và từ chối in rỗng/trùng phần tử.
  - Workflow business_key không rỗng, tối đa 256 ký tự.
  - PlatformJob.result của ingestion có cấu trúc IngestionResult và điều kiện theo trạng thái.
  - >-
    Dịch vụ dùng data GET cần scope data:read; dịch vụ đọc history cần data:history:read; file/workflow dùng
    scope và binding mới.
  unchanged: >-
    Event.schema_version vẫn là string phiên bản envelope/sự kiện; schema chung ở app-api.yaml và
    ai-tools-api.yaml không đổi.
  previous_pdf: >-
    API-Tang1-OpenCore-v1.0.pdf là snapshot trước thay đổi; nguồn chuẩn cho v0.2.0 là YAML này và phụ lục,
    không dùng PDF cũ như tài liệu đồng bộ.
