  /api/v1/core/data/{collection}/{record_id}/history:
    get:
      operationId: listRecordHistory
      summary: Đọc lịch sử phiên bản bản ghi theo quyền hiện tại
      description: >-
        Revision được lưu bền vững cùng transaction create/update/delete và schema_version, không chỉ tăng bộ
        đếm version. Kiểm tra collection, quyền bản ghi, field và tenant hiện tại trước khi lấy lịch sử; không
        lộ dữ liệu đã bị thu hồi quyền. Bản ghi đã soft-delete chỉ trả lịch sử nếu policy cho phép tra
        tombstone. Không có quyền/không có tài nguyên trả 404 theo chính sách che tồn tại. Sắp xếp version
        giảm dần; before_version là cận trên loại trừ để phân trang ổn định, next_before_version lấy version
        cuối trang khi còn trang tiếp. Retention hợp pháp có thể loại revision; không hứa lưu vô hạn.
      tags:
      - Data lifecycle
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: collection
        in: path
        required: true
        description: Collection được đăng ký và có schema/policy. Không cho truy cập collection hệ thống tùy ý.
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
      - name: record_id
        in: path
        required: true
        description: Mã tài nguyên.
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/PageSize'
      - name: before_version
        in: query
        required: false
        description: Chỉ trả revision có version nhỏ hơn giá trị này.
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Lịch sử đã áp policy và retention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordHistoryPage'
              example:
                items:
                - record_id: REC-1
                  version: 2
                  schema_version: 1
                  operation: update
                  changed_at: '2026-10-14T15:00:00Z'
                  data:
                    status: active
                next_before_version: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      security:
      - BearerAuth: []
      - ServiceAuth: []
        UserContext: []
      - ServiceAuth: []
        JobContext: []
      x-required-service-scope: data:history:read
  /api/v1/core/files/search:
    get:
      operationId: searchFiles
      summary: Tìm kiếm toàn văn nội dung tệp đã kiểm dịch
      description: >-
        q là truy vấn văn bản thuần, không nhận SQL, regex hoặc DSL của search engine. Tìm trong nội dung văn
        bản đã trích xuất của tệp clean, không chỉ tìm tên/metadata. Giới hạn ACL
        tenant/application/resource/dataset và field masking trước khi xếp hạng, excerpt, phân trang và tính
        total; quyền bị thu hồi phải có hiệu lực cả khi index chậm cập nhật. Tệp pending/rejected/failed không
        có trong kết quả. Sắp xếp độ liên quan giảm dần, file_id tăng dần khi bằng điểm; index cập nhật bất
        đồng bộ nên các trang không là snapshot cố định. Trả 503 nếu chưa có search/index backend; không tự
        thay bằng RAG hoặc kết quả tìm metadata.
      tags:
      - Files
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
          pattern: \S
        description: Từ khóa tìm kiếm toàn văn theo analyzer đã cấu hình, không phải cú pháp điều khiển backend.
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: resource_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
        description: Bộ lọc trong phạm vi đã được cấp quyền; không tự cấp quyền lên tài nguyên.
      responses:
        '200':
          description: Chỉ kết quả full-text có quyền đọc.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSearchPage'
              example:
                items: []
                page: 1
                page_size: 20
                total: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      security:
      - BearerAuth: []
      - ServiceAuth: []
      x-required-service-scope: files:read
      x-service-resource-policy: file_application_binding
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token từ Identity/SSO của OpenCore. Kiểm tra issuer, audience, expiry và quyền đối với
        tài nguyên.
    ServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token dịch vụ từ IAM; scope và tenant được kiểm tra ở dịch vụ nhận. Không phân phối token dịch
        vụ cho Web/App.
    UserContext:
      type: apiKey
      in: header
      name: X-User-Context
      description: JWT ngữ cảnh được ký bởi backend/issuer tin cậy, không phải JSON actor/role từ prompt. Xác minh
        signature, audience, tenant và expiry.
    JobContext:
      type: apiKey
      in: header
      name: X-Analysis-Job-Id
      description: Mã job chỉ là tham chiếu ngữ cảnh, không tự cấp quyền. Kèm ServiceAuth; dịch vụ đọc job từ OpenCore,
        kiểm tra tenant, principal khởi tạo và scope trước khi dùng dữ liệu.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/Id'
      description: Mã truy vết, không phải quyền truy cập.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Key ổn định cho một thao tác ghi; retry dùng lại key.
  responses:
    BadRequest:
      description: Request không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: Request không hợp lệ.
            request_id: REQ-001
            retryable: false
    Unauthorized:
      description: Thiếu hoặc sai thông tin xác thực.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHENTICATED
            message: Thiếu hoặc sai thông tin xác thực.
            request_id: REQ-001
            retryable: false
    Forbidden:
      description: Không có quyền trong tenant hoặc tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN
            message: Không có quyền trong tenant hoặc tài nguyên.
            request_id: REQ-001
            retryable: false
    NotFound:
      description: Không tìm thấy tài nguyên được phép truy cập.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: Không tìm thấy tài nguyên được phép truy cập.
            request_id: REQ-001
            retryable: false
    Conflict:
      description: Sai trạng thái, phiên bản, key retry hoặc yêu cầu đang được xử lý.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VERSION_CONFLICT
            message: Sai trạng thái, phiên bản, key retry hoặc yêu cầu đang được xử lý.
            request_id: REQ-001
            retryable: false
      headers:
        Retry-After:
          description: >-
            Số giây chờ, có khi Idempotency-Key cùng payload đang xử lý (retryable=true); trường hợp đó trả giá
            trị 2.
          schema:
            type: integer
            minimum: 1
    Unprocessable:
      description: Dữ liệu không đáp ứng điều kiện xử lý; ML có thể thiếu lịch sử.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: Dữ liệu không đáp ứng điều kiện xử lý; ML có thể thiếu lịch sử.
            request_id: REQ-001
            retryable: false
    RateLimited:
      description: Vượt giới hạn request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RATE_LIMITED
            message: Vượt giới hạn request.
            request_id: REQ-001
            retryable: true
    ServerError:
      description: Lỗi xử lý nội bộ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_ERROR
            message: Lỗi xử lý nội bộ.
            request_id: REQ-001
            retryable: false
    Unavailable:
      description: Dịch vụ phụ thuộc chưa sẵn sàng.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UPSTREAM_UNAVAILABLE
            message: Dịch vụ phụ thuộc chưa sẵn sàng.
            request_id: REQ-001
            retryable: true
    Timeout:
      description: Dịch vụ phụ thuộc vượt thời gian chờ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UPSTREAM_TIMEOUT
            message: Dịch vụ phụ thuộc vượt thời gian chờ.
            request_id: REQ-001
            retryable: true
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
      examples:
      - PR-001
    Timestamp:
      type: string
      format: date-time
      pattern: Z$
      examples:
      - '2026-10-13T03:00:00Z'
    Money:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: string
          pattern: ^(0|[1-9][0-9]{0,13})\.[0-9]{2}$
          examples:
          - '10000.00'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          examples:
          - VND
      required:
      - amount
      - currency
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - VALIDATION_ERROR
          - VERSION_CONFLICT
          - IDEMPOTENCY_CONFLICT
          - INVALID_STATE
          - INSUFFICIENT_DATA
          - MODEL_UNAVAILABLE
          - UPSTREAM_UNAVAILABLE
          - UPSTREAM_TIMEOUT
          - RATE_LIMITED
          - TOKEN_EXPIRED
          - TOKEN_INVALID
          - ANALYSIS_IN_PROGRESS
          - LEASE_EXPIRED
          - REQUEST_CHANGED
          - REPORT_MISMATCH
          - INTERNAL_ERROR
        message:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        request_id:
          $ref: '#/components/schemas/Id'
        retryable:
          type: boolean
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              reason:
                type: string
            required:
            - field
            - reason
      required:
      - code
      - message
      - request_id
      - retryable
    IdentityConfig:
      type: object
      additionalProperties: false
      properties:
        issuer:
          type: string
          format: uri
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        web_client_id:
          type: string
        mobile_client_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        pkce_required:
          const: true
      required:
      - issuer
      - authorization_endpoint
      - token_endpoint
      - jwks_uri
      - web_client_id
      - mobile_client_id
      - scopes
      - pkce_required
    Principal:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        tenant_id:
          $ref: '#/components/schemas/Id'
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
      required:
      - id
      - tenant_id
      - display_name
      - roles
      - permissions
    Filter:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          pattern: ^[a-z][a-z0-9_.]*$
        op:
          type: string
          enum:
          - eq
          - in
          - gte
          - lte
          - contains
        value:
          anyOf:
          - type:
            - string
            - number
            - boolean
            - 'null'
          - type: array
            items:
              type:
              - string
              - number
              - boolean
              - 'null'
            maxItems: 100
      required:
      - field
      - op
      - value
      description: >-
        Chỉ field/operator được registry và policy cho phép. in nhận mảng không rỗng; eq nhận scalar; gte/lte nhận
        số hoặc chuỗi ngày/thời gian hợp lệ theo schema field; contains là phép tìm chuỗi literal, không phải
        SQL/regex.
      allOf:
      - if:
          properties:
            op:
              const: in
          required:
          - op
        then:
          properties:
            value:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                type:
                - string
                - number
                - boolean
                - 'null'
      - if:
          properties:
            op:
              const: eq
          required:
          - op
        then:
          properties:
            value:
              type:
              - string
              - number
              - boolean
              - 'null'
      - if:
          properties:
            op:
              enum:
              - gte
              - lte
          required:
          - op
        then:
          properties:
            value:
              type:
              - number
              - string
      - if:
          properties:
            op:
              const: contains
          required:
          - op
        then:
          properties:
            value:
              type: string
              minLength: 1
              maxLength: 1000
              pattern: \S
