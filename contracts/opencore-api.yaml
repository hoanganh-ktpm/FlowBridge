      summary: Thực hiện hành động workflow hợp lệ
      description: >-
        Dịch vụ nghiệp vụ gọi với ngữ cảnh người quyết định đã xác minh. Engine kiểm tra action được đăng ký,
        người được giao, guard và expected_version; không cho service token tự thay thế quyền của người duyệt.
        Ghi audit và trạng thái nguyên tử. Tính nguyên tử ở đây chỉ bao gồm trạng thái task/instance và
        audit/outbox do Workflow adapter sở hữu. Đồng bộ với Core Data ở engine khác tuân
        x-workflow-consistency; không cam kết giao dịch phân tán ngầm.
      tags:
      - Workflow
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: task_id
        in: path
        required: true
        description: Mã tài nguyên.
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowAction'
      security:
      - ServiceAuth: []
        UserContext: []
      x-required-service-scope: workflow:act-on-behalf
