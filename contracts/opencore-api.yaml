# Hợp đồng API mô tả trước triển khai.
# OpenAPI 3.1; file tự chứa các schema để mở độc lập trong Swagger Editor.
# Đề PMNM 2026: https://www.vfossa.vn/tin-tuc/de-thi-phan-mem-nguon-mo-olp-2026-798.html
openapi: 3.1.0
info:
  title: DX OS OpenCore Headless API
  version: 0.2.0
  description: >-
    Nền tảng lõi không có giao diện người dùng cuối. Cung cấp Identity/SSO, Gateway, dữ liệu cấu trúc/phi cấu
    trúc và Workflow dùng chung.

    API dữ liệu tự sinh hoặc ánh xạ từ engine được chọn; schema và policy được đăng ký cho từng ứng dụng. Lõi
    không hardcode nhà cung cấp hay quy tắc mua hàng.

    API không tự chứng minh hoàn tất triển khai GitOps, kiểm dịch tệp, tích hợp IT/OT hay lưu trữ lịch sử; các
    phần vận hành được ghi riêng trong x-olp2026.

    Phiên bản 0.2.0 chuẩn hóa quyền dịch vụ, phiên bản schema, lịch sử bản ghi và tìm kiếm toàn văn. Đây là
    hợp đồng yêu cầu triển khai, không phải bằng chứng các dịch vụ đã vận hành.
externalDocs:
  description: Đề PMNM OLP 2026 trên VFOSSA
  url: https://www.vfossa.vn/tin-tuc/de-thi-phan-mem-nguon-mo-olp-2026-798.html
servers:
- url: http://localhost:8080
  description: Ví dụ local; thay bằng URL cấu hình của dịch vụ tương ứng.
security:
- BearerAuth: []
x-contract-status: Thiết kế trước triển khai; đường dẫn ánh xạ qua Gateway hoặc adapter theo sản phẩm lõi được chọn.
x-owner: 'Người 1: tích hợp OpenCore và cấu hình nền tảng'
x-architecture-layer: DX-OS Tầng 1; lớp triển khai 1
x-conventions:
  ids: Chuỗi định danh; PR-001, SUP-A trong examples là dữ liệu minh họa.
  time: Timestamp UTC ISO 8601 kết thúc bằng Z; delivery_date là ngày nghiệp vụ Asia/Saigon.
  money: Chuỗi thập phân hai chữ số, kèm currency; server dùng decimal để tính giá trị.
  errors: Cùng ErrorResponse trong opencore-api.yaml; không trả stack trace hoặc bí mật.
  tenancy: Tenant và quyền lấy từ danh tính đã xác minh; không lấy từ JSON hoặc prompt người dùng.
  concurrency: version/expected_version được kiểm tra khi thay đổi tài nguyên; sai phiên bản trả 409.
  idempotency: >-
    POST có Idempotency-Key: cùng principal/tenant/method/path/key và cùng payload chuẩn hóa trả lại kết quả
    cũ trong tối thiểu 24 giờ từ khi chấp nhận; payload khác trả 409 IDEMPOTENCY_CONFLICT (retryable=false).
    Key đang xử lý trả 409 IDEMPOTENCY_CONFLICT (retryable=true, Retry-After=2), không thực thi lần hai.
    Replay không phát thêm sự kiện. Chi tiết multipart và tác vụ dài nằm ở x-idempotency-policy.
tags:
- name: Identity
- name: Data
- name: Data lifecycle
- name: Files
- name: Workflow
- name: Events
- name: Audit
paths:
  /api/v1/core/identity/config:
    get:
      operationId: getIdentityConfig
      summary: Lấy cấu hình SSO cho Web và mobile
      description: Client dùng Authorization Code với PKCE theo issuer. Không tạo API password-login riêng; không
        trả client_secret. Redirect URI phải nằm trong allowlist IAM.
      tags:
      - Identity
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      security: []
  /api/v1/core/identity/me:
    get:
      operationId: getPrincipal
      summary: Lấy danh tính và quyền hiện tại
      description: IAM xác minh access token; trả principal và quyền trong tenant. Frontend dùng để hiển thị; server
        vẫn kiểm tra từng thao tác.
      tags:
      - Identity
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/core/data/{collection}:
    get:
      operationId: listRecords
      summary: Tra cứu dữ liệu có cấu trúc
      description: >-
        Gateway định tuyến hoặc dịch vụ nội bộ gọi Data API trực tiếp. Data API áp dụng row-level policy/cách ly
        tenant trước filters, phân trang; việc đọc không tự chạy AI. Gọi nội bộ dùng ServiceAuth cùng
        UserContext đã ký hoặc JobContext được đối chiếu bản ghi job; vẫn áp dụng policy theo principal/tenant
        gốc.
      tags:
      - Data
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: collection
        in: path
        required: true
        description: Collection được đăng ký và có schema/policy. Không cho truy cập collection hệ thống tùy ý.
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: filters
        in: query
        required: false
        description: Mảng điều kiện mã hóa JSON. Chỉ field/operator đã được schema/policy cho phép; không nhận SQL.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Filter'
              maxItems: 20
            example:
            - field: status
              op: eq
              value: active
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordList'
              example:
                items:
                - id: SUP-A
                  version: 1
                  data:
                    name: Nhà cung cấp A
                    email: supplier-a@example.invalid
                    status: active
                  created_at: '2026-10-13T03:00:00Z'
                  updated_at: '2026-10-13T03:00:00Z'
                page: 1
                page_size: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      security:
      - BearerAuth: []
      - ServiceAuth: []
        UserContext: []
      - ServiceAuth: []
        JobContext: []
      x-required-service-scope: data:read
    post:
      operationId: createRecord
      summary: Tạo bản ghi theo schema và policy
      description: >-
        Data engine kiểm tra schema, field được phép ghi và quan hệ dữ liệu. Các collection mua hàng được bảo vệ
        service-only; thao tác người dùng tạo mua hàng dùng app-api.yaml. Phát record.created sau commit.
      tags:
      - Data
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: collection
        in: path
        required: true
        description: Collection được đăng ký và có schema/policy. Không cho truy cập collection hệ thống tùy ý.
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Đã tạo tài nguyên.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCreate'
  /api/v1/core/data/{collection}/{record_id}:
    get:
      operationId: getRecord
      summary: Đọc một bản ghi
      description: >-
        Đọc PostgreSQL qua data engine, kiểm tra quyền cấp bản ghi và field. data theo schema collection; DTO
        ứng dụng nằm ở app-api.yaml. Gọi nội bộ dùng ServiceAuth cùng UserContext đã ký hoặc JobContext được đối
        chiếu bản ghi job; vẫn áp dụng policy theo principal/tenant gốc.
      tags:
      - Data
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: collection
        in: path
        required: true
        description: Collection được đăng ký và có schema/policy. Không cho truy cập collection hệ thống tùy ý.
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
      - name: record_id
        in: path
        required: true
        description: Mã tài nguyên.
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
              example:
                id: SUP-A
                version: 1
                data:
                  name: Nhà cung cấp A
                  email: supplier-a@example.invalid
                  status: active
                created_at: '2026-10-13T03:00:00Z'
                updated_at: '2026-10-13T03:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      security:
      - BearerAuth: []
      - ServiceAuth: []
        UserContext: []
      - ServiceAuth: []
        JobContext: []
      x-required-service-scope: data:read
    patch:
      operationId: updateRecord
      summary: Cập nhật bản ghi có kiểm tra phiên bản
      description: >-
        PATCH chỉ các field được policy cho phép; expected_version khác hiện tại trả 409. Không cho sửa trực
        tiếp trạng thái workflow/PO/analysis từ tài khoản người dùng.
      tags:
      - Data
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: collection
        in: path
        required: true
        description: Collection được đăng ký và có schema/policy. Không cho truy cập collection hệ thống tùy ý.
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
      - name: record_id
        in: path
        required: true
        description: Mã tài nguyên.
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPatch'
    delete:
      operationId: deleteRecord
      summary: Xóa bản ghi theo policy và phiên bản
      description: >-
        Kiểm tra quyền, expected_version và các liên kết; áp dụng soft-delete/retention theo policy. Các
        collection giao dịch/PO/lịch sử của ứng dụng không cho end-user xóa tùy ý. Ghi audit; xóa hợp lệ không
        mất dấu truy vết.
      tags:
      - Data
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: collection
        in: path
        required: true
        description: Collection được đăng ký và có schema/policy. Không cho truy cập collection hệ thống tùy ý.
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
      - name: record_id
        in: path
        required: true
        description: Mã tài nguyên.
        schema:
          $ref: '#/components/schemas/Id'
      - name: expected_version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '204':
          description: Thành công.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/core/data-schemas/{collection}:
    get:
      operationId: getCollectionSchema
      summary: Đọc schema và chính sách collection được đăng ký
      description: Trả schema/phiên bản cho collection có quyền sử dụng; metadata chỉ chứa policy_key, không trả
        bí mật hoặc cấu hình quyền nội bộ. UI/adapter dùng để ánh xạ Data API.
      tags:
      - Data
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: collection
        in: path
        required: true
        description: Collection được đăng ký và có schema/policy. Không cho truy cập collection hệ thống tùy ý.
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /internal/v1/core/data-schemas:
    post:
      operationId: registerCollectionSchema
      summary: Đăng ký schema ứng dụng trên lõi dùng chung
      description: Chỉ scope data:schema:deploy. Định nghĩa dữ liệu theo JSON Schema và policy đã đăng ký; kiểm
        tra nguồn tham chiếu trong allowlist, không tự tải URL tùy ý. Migration/triển khai cấu trúc vật lý vẫn theo
        quy trình nền tảng/GitOps. Lõi sinh hoặc ánh xạ Data API mà không hardcode mô hình mua hàng.
      tags:
      - Data
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Đã tạo tài nguyên.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionDefinition'
      security:
      - ServiceAuth: []
      x-required-service-scope: data:schema:deploy
  /internal/v1/core/data/transactions:
    post:
      operationId: commitTransaction
      summary: Ghi nhiều bản ghi trong một giao dịch
      description: Scope được cấp theo ứng dụng/collection. Toàn bộ operations commit hoặc rollback. Dùng để ghi
        dữ liệu nghiệp vụ cùng outbox; dispatcher mới phát sự kiện sau commit. Không nhận SQL.
      tags:
      - Data
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      security:
      - ServiceAuth: []
      x-required-service-scope: data:transaction
  /internal/v1/core/ingestion-jobs:
    post:
      operationId: createIngestionJob
      summary: Nạp dữ liệu IT hoặc OT theo lô
      description: >-
        Ghi nguồn, thời điểm quan sát và schema_version; tạo tác vụ chạy nền. Adapter nguồn và lưu trữ lịch
        sử/lakehouse là cấu hình nền tảng. Dữ liệu batch vẫn kiểm tra tenant/schema. schema_version phải khớp
        registry CollectionSchemaVersion trước enqueue. Một lô tối đa 1000 bản ghi được validate toàn bộ và
        commit/rollback nguyên tử tại kho giao dịch; adapter lấy dữ liệu quy mô lớn phải chia lô. Worker ghi
        lineage và outbox cùng giao dịch; lỗi validation không ghi một phần lô.
      tags:
      - Data lifecycle
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Đã nhận tác vụ để xử lý nền.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
