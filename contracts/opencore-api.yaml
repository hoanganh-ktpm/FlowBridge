      summary: Lưu tệp vào khu vực kiểm dịch
      description: >-
        Kiểm tra quyền, loại và kích thước tệp theo policy. Trả 202 với scan_status pending; scanner xử lý nền.
        Chỉ tệp clean được tải xuống hoặc đưa vào RAG. Core hỗ trợ lưu tài liệu dùng chung; ứng dụng RAG demo
        chỉ dùng Markdown đã chuẩn bị. Caller người dùng áp dụng policy hiện có. Caller dịch vụ phải có scope
        tương ứng, token dịch vụ đúng audience/tenant/application và binding tài nguyên/dataset được server kiểm
        chứng; không dùng metadata hoặc request_id do caller tự khai để cấp quyền. Khi có UserContext, phải giao
        quyền dịch vụ với quyền người dùng, không được bỏ qua ngữ cảnh để tăng quyền. Tác vụ nền dùng quyền dịch
